name: Prepare policy integration

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt')
          text = path.read_text()
          old = '''    private fun resolvedFeatures(packages: Array<String>): FeatureSet {
              val current = snapshot
              val base = activeProfile(current)?.let { current.features.withOverrides(it.featureOverrides) } ?: current.features
              val selected = selectProfile(packages, current).profile
              return selected?.let { base.withOverrides(it.featureOverrides) } ?: base
          }
'''
          new = '''    private fun resolvedFeatures(packages: Array<String>): FeatureSet {
              val current = snapshot
              val base = activeProfile(current)?.let { current.features.withOverrides(it.featureOverrides) } ?: current.features
              val selected = selectProfile(packages, current).let { it.profile }
              return selected?.let { base.withOverrides(it.featureOverrides) } ?: base
          }
'''
          if text.count(old) != 1:
              raise SystemExit('resolvedFeatures block mismatch')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/prepare-v2.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: align policy resolver"
          git push origin HEAD:granular-policy-state-v2
