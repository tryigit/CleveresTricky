name: Apply Build warning gates v2

on:
  push:
    branches: [ "granular-policy-state-v2" ]
    paths:
      - ".github/workflows/apply-build-warning-gates-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: granular-policy-state-v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python .tmp/integrate_build_warning_gates.py
      - run: git rm .github/workflows/strict-first-party-warnings.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build.yml
          git commit -m "ci: integrate warning gates into Build"
          git push
