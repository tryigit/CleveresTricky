name: Fix Rust formatting for PR 1245

on:
  push:
    branches:
      - fix/webui-adapter-registration-starvation

permissions:
  contents: write

concurrency:
  group: fmt-pr1245-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/webui-adapter-registration-starvation
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Format Rust sources
        run: cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Commit formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: rustfmt daemon relay"
          git push origin HEAD:fix/webui-adapter-registration-starvation
