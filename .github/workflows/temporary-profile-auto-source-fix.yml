name: Temporary Profile Auto Source Fix

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  patch-policy-source:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/identity-profile-cron-logs' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply token-exact PolicyState source precedence fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt')
          text = path.read_text()

          def replace_once(label: str, old: str, new: str) -> None:
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one token, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'uid-resolution-field',
              '        val features: FeatureSet,\n    )\n\n    private data class CapturedPatch',
              '        val features: FeatureSet,\n        val profileAutoIdentity: Boolean,\n    )\n\n    private data class CapturedPatch',
          )

          helper_marker = '    private fun resolveUid(uid: Int): UidResolution {'
          helper_code = '''    private fun profileAutoIdentityEnabled(profile: Profile?, current: Snapshot): Boolean {
              val activeOverride = activeProfile(current)?.featureOverrides?.get(Feature.IDENTITY_REFRESH) ?: false
              return profile?.featureOverrides?.get(Feature.IDENTITY_REFRESH) ?: activeOverride
          }

          private fun featuresForProfile(profile: Profile?, current: Snapshot): FeatureSet {
              val base = activeProfile(current)?.let { current.features.withOverrides(it.featureOverrides) } ?: current.features
              return profile?.let { base.withOverrides(it.featureOverrides) } ?: base
          }

          '''
          if 'private fun profileAutoIdentityEnabled(' not in text:
              replace_once('resolution-helpers', helper_marker, helper_code + helper_marker)

          replace_once(
              'resolve-features',
              '        val base = activeProfile(current)?.let { current.features.withOverrides(it.featureOverrides) } ?: current.features\n        val features = selection.profile?.let { base.withOverrides(it.featureOverrides) } ?: base\n        val resolved = UidResolution(current.generation, packages.clone(), selection, features)',
              '        val features = featuresForProfile(selection.profile, current)\n        val profileAutoIdentity = profileAutoIdentityEnabled(selection.profile, current)\n        val resolved = UidResolution(current.generation, packages.clone(), selection, features, profileAutoIdentity)',
          )

          methods_marker = '    private fun hasRuntimeScope(profile: Profile, current: Snapshot): Boolean ='
          methods_code = '''    internal fun isTopLevelFeatureEnabled(feature: Feature): Boolean = snapshot.features.enabled(feature)

          internal fun isProfileAutoIdentityEnabled(uid: Int): Boolean {
              if (!snapshot.explicit) return false
              val resolved = resolveUid(uid)
              return resolved.profileAutoIdentity && resolved.features.buildIdentity
          }

          internal fun hasProfileAutoIdentityWork(): Boolean {
              val current = snapshot
              if (!current.explicit) return false
              val active = activeProfile(current)

              fun hasWork(profile: Profile): Boolean {
                  val features = featuresForProfile(profile, current)
                  return profileAutoIdentityEnabled(profile, current) && features.buildIdentity
              }

              if (active != null && hasWork(active)) return true
              return current.profiles.values.any { profile ->
                  profile.enabled &&
                      profile.applications.isNotEmpty() &&
                      (active == null || !profile.name.equals(active.name, ignoreCase = true)) &&
                      hasWork(profile)
              }
          }

          '''
          if 'internal fun isTopLevelFeatureEnabled(' not in text:
              replace_once('policy-auto-methods', methods_marker, methods_code + methods_marker)

          replace_once(
              'merge-signature',
              '    private fun mergeAppConfig(\n        profile: Profile?,\n        legacy: Config.AppSpoofConfig?,\n    ): Config.AppSpoofConfig? {',
              '    private fun mergeAppConfig(\n        profile: Profile?,\n        legacy: Config.AppSpoofConfig?,\n        useAutoIdentitySource: Boolean = false,\n    ): Config.AppSpoofConfig? {',
          )
          replace_once(
              'merge-template-source',
              '                profile.template ?: legacy?.template,',
              '                if (useAutoIdentitySource) null else profile.template ?: legacy?.template,',
          )
          replace_once(
              'resolve-app-config',
              '    fun resolveAppConfig(\n        uid: Int,\n        legacy: Config.AppSpoofConfig?,\n    ): Config.AppSpoofConfig? = mergeAppConfig(resolveUid(uid).selection.profile, legacy)',
              '    fun resolveAppConfig(\n        uid: Int,\n        legacy: Config.AppSpoofConfig?,\n    ): Config.AppSpoofConfig? {\n        val resolved = resolveUid(uid)\n        val useAutoIdentitySource = resolved.profileAutoIdentity && resolved.features.buildIdentity\n        return mergeAppConfig(resolved.selection.profile, legacy, useAutoIdentitySource)\n    }',
          )
          replace_once(
              'effective-source-resolution',
              '        val legacyRule = readLegacyAppRule(packageName)\n        val appConfig = mergeAppConfig(profile, legacyRule)',
              '        val legacyRule = readLegacyAppRule(packageName)\n        val profileAutoIdentity = profileAutoIdentityEnabled(profile, current) && features.buildIdentity\n        val appConfig = mergeAppConfig(profile, legacyRule, profileAutoIdentity)',
          )
          replace_once(
              'effective-source-json',
              '            .put("identityTemplate", appConfig?.template ?: JSONObject.NULL)\n            .put("keyboxReference", appConfig?.keyboxFilename ?: JSONObject.NULL)',
              '            .put("identityTemplate", appConfig?.template ?: JSONObject.NULL)\n            .put("identitySource", if (profileAutoIdentity) "auto_identity" else if (appConfig?.template != null) "template" else "global")\n            .put("keyboxReference", appConfig?.keyboxFilename ?: JSONObject.NULL)',
          )

          path.write_text(text)
          PY

          git diff --check

      - name: Commit PolicyState patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt
          git commit -m "fix(identity): make profile Auto Identity own its source"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
