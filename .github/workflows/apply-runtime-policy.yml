name: Apply runtime policy integration

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new, count in replacements:
                  actual = text.count(old)
                  if actual != count:
                      raise SystemExit(f'{path}: expected {count}, found {actual}: {old[:100]!r}')
                  text = text.replace(old, new, count)
              p.write_text(text)

          edit('service/src/main/java/cleveres/tricky/cleverestech/BootLogic.kt', [
              ('            val requestedBuildIdentity = Config.isSpoofEnabled && Config.isBuildIdentityEnabled\n', '            val requestedBuildIdentity = PolicyState.isFeatureEnabled(PolicyState.Feature.BUILD_IDENTITY)\n', 1),
              ('                Config.isSpoofEnabled &&\n                    isRegularFile(File(configDir, FILE_SPOOF_CN)) &&\n', '                PolicyState.isFeatureEnabled(PolicyState.Feature.REGION_IDENTITY) &&\n', 1),
              ('                copy("TAGS", "ro.build.tags")\n                copy("SECURITY_PATCH", "ro.build.version.security_patch")\n', '                copy("TAGS", "ro.build.tags")\n', 1),
          ])

          edit('service/src/main/java/cleveres/tricky/cleverestech/SecurityLevelInterceptor.kt', [
              ('!Config.isRkpPassthroughEnabled &&', '!PolicyState.rkpPassthrough(callingUid) &&', 1),
              ('            Config.isRkpPassthroughEnabled ||\n', '            PolicyState.rkpPassthrough(callingUid) ||\n', 1),
          ])

          edit('service/src/main/java/cleveres/tricky/cleverestech/DrmInterceptor.kt', [
              ('        private fun shouldProtectUid(uid: Int): Boolean =\n            Config.isSpoofEnabled && Config.getAppPrivacyMode(uid) == Config.AppPrivacyMode.ISOLATE\n', '        private fun shouldProtectUid(uid: Int): Boolean =\n            Config.getAppPrivacyMode(uid) == Config.AppPrivacyMode.ISOLATE &&\n                (PolicyState.usesV2() || Config.isSpoofEnabled) &&\n                PolicyState.profileDrmPassthrough(uid) != true\n', 1),
          ])

          edit('service/src/main/java/cleveres/tricky/cleverestech/Main.kt', [
              ('            var drmSuccess = !identityEngineEnabled || DrmInterceptor.isRunning()\n', '            val drmEnabled = Config.shouldInterceptDrm\n            var drmSuccess = !drmEnabled || DrmInterceptor.isRunning()\n', 1),
              ('                if (identityEngineEnabled && !drmSuccess) {\n', '                if (drmEnabled && !drmSuccess) {\n', 1),
              ('            if (!identityEngineEnabled && (previousDrmEngineState != false || drmStopPending)) {\n', '            if (!drmEnabled && (previousDrmEngineState != false || drmStopPending)) {\n', 1),
              ('            } else if (identityEngineEnabled) {\n                drmStopPending = false\n            }\n            previousDrmEngineState = if (drmStopPending) null else identityEngineEnabled\n', '            } else if (drmEnabled) {\n                drmStopPending = false\n            }\n            previousDrmEngineState = if (drmStopPending) null else drmEnabled\n', 1),
          ])

          edit('service/src/main/java/cleveres/tricky/cleverestech/WebUiBridge.kt', [
              ('            val response = server.serveBridge(parsed.session)\n', '            val response = PolicyApi.serve(parsed.session) ?: server.serveBridge(parsed.session)\n', 1),
          ])

          edit('service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt', [
              ('                "boot_props_mode",\n            )\n        private val BACKUP_CONFIG_FILES', '                "boot_props_mode",\n                PolicyState.STATE_FILE,\n            )\n        private val BACKUP_CONFIG_FILES', 1),
              ('                "boot_props_mode",\n            )\n        private val APP_RULE_FIELDS', '                "boot_props_mode",\n                PolicyState.STATE_FILE,\n            )\n        private val APP_RULE_FIELDS', 1),
              ('            if (filename == "target.txt") {\n', '            if (filename == PolicyState.STATE_FILE) {\n                return PolicyState.validateStateJson(content, validateReferences = false).isSuccess\n            }\n            if (filename == "target.txt") {\n', 1),
          ])

          edit('build.gradle.kts', [
              ('            allWarningsAsErrors.set(!name.contains("UnitTest"))\n', '            allWarningsAsErrors.set(true)\n', 1),
          ])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add service/src/main/java/cleveres/tricky/cleverestech/BootLogic.kt service/src/main/java/cleveres/tricky/cleverestech/SecurityLevelInterceptor.kt service/src/main/java/cleveres/tricky/cleverestech/DrmInterceptor.kt service/src/main/java/cleveres/tricky/cleverestech/Main.kt service/src/main/java/cleveres/tricky/cleverestech/WebUiBridge.kt service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt build.gradle.kts
          git commit -m "feat: activate granular runtime policies"
          git push origin HEAD:granular-policy-state-v2
