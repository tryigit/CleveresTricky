name: Align RKP retirement unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: write

jobs:
  update-tests:
    if: github.head_ref == 'fix/retire-rkp-passthrough-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update retired RKP API expectations
        shell: python
        run: |
          from pathlib import Path

          p = Path('service/src/test/java/cleveres/tricky/cleverestech/ActionTest.kt')
          text = p.read_text(encoding='utf-8')

          old = '''                "telephony",\n                "rkp_passthrough",\n                "drm_passthrough",\n'''
          new = '''                "telephony",\n                "drm_passthrough",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one live settings block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                "hide_sensitive_props",\n                "rkp_bypass",\n                "spoof_props",\n'''
          new = '''                "hide_sensitive_props",\n                "rkp_passthrough",\n                "rkp_bypass",\n                "spoof_props",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one removed settings block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                    !File(configDir, "apply_profile").exists() &&\n                    !File(configDir, "rkp_bypass").exists() &&\n                    !File(configDir, "spoof_props").exists()\n'''
          new = '''                    !File(configDir, "apply_profile").exists() &&\n                    !File(configDir, "rkp_passthrough").exists() &&\n                    !File(configDir, "rkp_bypass").exists() &&\n                    !File(configDir, "spoof_props").exists()\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one profile wait block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            assertFalse(config.has("rkp_bypass"))\n            assertFalse(config.has("spoof_props"))\n'''
          new = '''            assertFalse(config.has("rkp_passthrough"))\n            assertFalse(config.has("rkp_bypass"))\n            assertFalse(config.has("spoof_props"))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one profile config assertion block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          p.write_text(text, encoding='utf-8')

      - name: Run focused service test
        run: ./gradlew :service:testDebugUnitTest --tests cleveres.tricky.cleverestech.ActionTest --warning-mode=fail --console=plain --no-build-cache

      - name: Commit test alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-rkp-retirement-tests.yml
          git add service/src/test/java/cleveres/tricky/cleverestech/ActionTest.kt
          git commit -m "test: align retired RKP control expectations"
          git push origin HEAD:${{ github.head_ref }}
