name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # Phase 1: Quality Gate & Linting
  # ============================================================
  quality-gate:
    name: "🛡️ Quality Gate & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: "🐚 Shell Script Linting (Shellcheck)"
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck module/template/*.sh

      - name: "🎨 Kotlin Format & Quality (Ktlint)"
        run: ./gradlew ktlintCheck

      - name: "📱 Android Static Analysis (Lint)"
        run: ./gradlew :service:lintDebug :stub:lintDebug :encryptor-app:lintDebug

  # ============================================================
  # Phase 2: Rust Tests & Linters
  # ============================================================
  rust-test:
    name: "🦀 Rust Checks & Tests"
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      RUSTFLAGS: "-D warnings"
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Security Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # ============================================================
  # Phase 3: Build artifacts
  # ============================================================
  build:
    name: "🛠️ Build Module"
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "🔒 SELinux Policy Validation"
        run: |
          echo "=== Checking sepolicy.rule for missing semicolons ==="
          ERRORS=0
          LINE_NUM=0
          while IFS= read -r line; do
            LINE_NUM=$((LINE_NUM + 1))
            trimmed=$(echo "$line" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
            [ -z "$trimmed" ] && continue
            [[ "$trimmed" == \#* ]] && continue
            [[ "$trimmed" == type\ * ]] && continue

            if echo "$trimmed" | grep -qE '^(allow|dontaudit|neverallow|auditallow) '; then
              statement=$(echo "$trimmed" | sed 's/#.*//' | sed 's/[[:space:]]*$//')
              if [[ "$statement" != *";" ]]; then
                echo "::error file=module/template/sepolicy.rule,line=$LINE_NUM::Missing semicolon: $trimmed"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done < module/template/sepolicy.rule
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: "📱 KernelSU/APatch Module Structure Validation"
        run: |
          ERRORS=0
          for f in module.prop customize.sh service.sh post-fs-data.sh sepolicy.rule; do
            if [ ! -f "module/template/$f" ]; then
              echo "::error::Missing required module file: module/template/$f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          for script in module/template/action.sh module/template/customize.sh module/template/service.sh module/template/post-fs-data.sh; do
            if [ -f "$script" ]; then
              if ! bash -n "$script" 2>/dev/null; then
                echo "::error file=$script::Shell syntax error"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Run Module Tests
        run: ./gradlew :module:testDebugUnitTest

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Print Failed Tests
        if: failure()
        run: |
          find . -path "*/test-results/*" -name "*.xml" -exec grep -l 'failures="[1-9]' {} \; | while read f; do
            echo "=== FAILED: $f ==="
            cat "$f"
          done

      - name: Build Android Artifacts
        run: |
          ./gradlew zipRelease
          ./gradlew zipDebug
          ./gradlew :encryptor-app:assembleRelease

      - name: Upload release zip
        uses: actions/upload-artifact@v7
        with:
          name: CleveresTricky-release
          path: "module/release/*-release.zip"
          if-no-files-found: error
          compression-level: 0

      - name: Upload debug zip
        uses: actions/upload-artifact@v7
        with:
          name: CleveresTricky-debug
          path: "module/release/*-debug.zip"
          if-no-files-found: error
          compression-level: 0

      - name: Upload Encryptor App
        uses: actions/upload-artifact@v7
        with:
          name: EncryptorApp
          path: "encryptor-app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          compression-level: 0

  # ============================================================
  # Phase 4: Publish only after a protected master push
  # ============================================================
  release:
    name: "📦 Publish Release"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release zip
        uses: actions/download-artifact@v8
        with:
          name: CleveresTricky-release
          path: release-assets

      - name: Download debug zip
        uses: actions/download-artifact@v8
        with:
          name: CleveresTricky-debug
          path: release-assets

      - name: Download Encryptor App
        uses: actions/download-artifact@v8
        with:
          name: EncryptorApp
          path: release-assets

      - name: Check release version
        id: release_version
        shell: bash
        run: |
          version=$(sed -n 's/^val verName by extra("[vV]\{0,1\}\([^"]*\)").*/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Could not read verName from build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/V$version" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.release_version.outputs.create == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "V${{ steps.release_version.outputs.version }}"
          name: "Release V${{ steps.release_version.outputs.version }}"
          generate_release_notes: true
          files: "release-assets/*"
