name: Build

# Isolated same-repository runner for PR #953; this branch is never merged.
on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  pr953-fixup-runner:
    if: github.head_ref == 'agent/pr953-fixup-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR 953 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Align Indonesian resource qualifier with Android
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('encryptor-app/src/test/java/cleveres/tricky/encryptor/LocalizationParityTest.kt')
          text = test_path.read_text()
          old = '                "values-b+id" to "id",\n'
          new = '                "values-in" to "id",\n'
          if text.count(old) != 1:
              raise SystemExit(f'Indonesian resource mapping count: {text.count(old)}')
          test_path.write_text(text.replace(old, new, 1))

          locale_config = Path('encryptor-app/src/main/res/xml/locales_config.xml').read_text()
          if '<locale android:name="id" />' not in locale_config:
              raise SystemExit('Expected modern Indonesian locale tag id in locales_config.xml')
          PY

          mkdir -p encryptor-app/src/main/res/values-in
          cp 'encryptor-app/src/main/res/values-b+id/strings.xml' encryptor-app/src/main/res/values-in/strings.xml
          rm 'encryptor-app/src/main/res/values-b+id/strings.xml'
          rmdir 'encryptor-app/src/main/res/values-b+id'

      - name: Run locale parity regression first
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :encryptor-app:testDebugUnitTest --tests 'cleveres.tricky.encryptor.LocalizationParityTest' --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Run Kotlin format gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew ktlintCheck --warning-mode=fail --console=plain --no-build-cache

      - name: Run exact Android lint gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:lintDebug :stub:lintDebug :encryptor-app:lintDebug --warning-mode=fail --console=plain --continue --no-build-cache

      - name: Run exact Security Regression JVM suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest :stub:testDebugUnitTest :encryptor-app:testDebugUnitTest --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Commit and push PR 953
        shell: bash
        run: |
          set -euo pipefail
          git add -A \
              encryptor-app/src/test/java/cleveres/tricky/encryptor/LocalizationParityTest.kt \
              encryptor-app/src/main/res/values-in \
              'encryptor-app/src/main/res/values-b+id'
          git diff --cached --check
          git commit -m 'fix: align Indonesian resources with Android locale handling'
          git push origin HEAD:agent/rust-first-service-redesign
