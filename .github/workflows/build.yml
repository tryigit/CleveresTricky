name: Build

# Isolated same-repository runner for PR #953; this branch is never merged.
on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  pr953-fixup-runner:
    if: github.head_ref == 'agent/pr953-fixup-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out PR 953 head
        uses: actions/checkout@v4
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Merge master and apply semantic fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          if git merge --no-ff --no-commit origin/master; then
            echo 'Expected semantic conflicts were not produced.' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          ours = subprocess.check_output(["git", "show", ":2:module/template/customize.sh"], text=True)
          ours = ours.replace("'service.sh'      \"$MODPATH\"", "'service.sh' \"$MODPATH\"")
          Path('/tmp/customize.ours').write_text(ours)
          PY
          customize_blob=$(git hash-object -w /tmp/customize.ours)
          printf '100755 %s 2\tmodule/template/customize.sh\n' "$customize_blob" | git update-index --index-info
          sed -i 's/"jvmTarget = JvmTarget.JVM_11" not in value/"JVM_11" not in value/' .github/scripts/pr953_fixup.py
          sed -i 's/"cargo ndk" not in build_ours/"cargo" not in build_ours/' .github/scripts/pr953_fixup.py
          python3 .github/scripts/pr953_fixup.py

      - name: Format and validate Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cd rust
          cargo fmt --all
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate shell payloads
        shell: bash
        run: |
          set -euo pipefail
          bash -n module/template/customize.sh
          bash -n module/template/action.sh
          bash -n module/template/service.sh
          bash -n module/template/post-fs-data.sh

      - name: Run service unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest --warning-mode=fail --console=plain --no-build-cache

      - name: Commit and push PR 953
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m 'fix: stabilize runtime lifecycle and keybox activation'
          git push origin HEAD:agent/rust-first-service-redesign
