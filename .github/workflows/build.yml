name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: "🧭 Change Detection"
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      gradle: ${{ steps.filter.outputs.gradle }}
      shell: ${{ steps.filter.outputs.shell }}
      webui: ${{ steps.filter.outputs.webui }}
      module: ${{ steps.filter.outputs.module }}
      android_app: ${{ steps.filter.outputs.android_app }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            for key in rust gradle shell webui module android_app build; do
              echo "$key=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed_files=$(git diff --name-only "$base" "$head")
          printf '%s\n' "$changed_files"

          has_match() {
            grep -Eq "$1" <<<"$changed_files"
          }

          rust=false
          gradle=false
          shell=false
          webui=false
          module=false
          android_app=false
          build=false
          shared_gradle=false

          if has_match '^(build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew|gradlew\.bat)$|^gradle/|^buildSrc/'; then
            shared_gradle=true
          fi

          if has_match '^rust/'; then
            rust=true
          fi

          if has_match '(^|/)(build\.gradle(\.kts)?|gradle\.properties)$|^settings\.gradle\.kts$|^gradle/|^gradlew(\.bat)?$|^buildSrc/|\.(kt|kts|java|xml)$'; then
            gradle=true
          fi

          if has_match '\.sh$'; then
            shell=true
          fi

          if has_match '^module/(template/webroot|webui-tests)/'; then
            webui=true
          fi

          if has_match '^(module|service|stub|rust)/|^\.gitmodules$'; then
            module=true
          fi

          if has_match '^encryptor-app/'; then
            android_app=true
          fi

          if [[ "$shared_gradle" == "true" ]]; then
            module=true
            android_app=true
          fi

          # Rust is part of the service/module/native integration contract. Any change in
          # those consumers must run the full workspace quality gate, not only selected tests.
          if [[ "$module" == "true" || "$android_app" == "true" ]]; then
            rust=true
            build=true
          fi

          # Root native build metadata can affect the Rust-facing integration even when it is
          # outside the module/service directory scopes above.
          if has_match '(^|/)(CMakeLists\.txt|[^/]+\.cmake|Android\.bp|Android\.mk)$|(^|/)(ndk|externalNativeBuild)/'; then
            rust=true
            module=true
            build=true
          fi

          # Every workflow change must exercise the complete set of controlled quality gates.
          if has_match '^\.github/workflows/'; then
            rust=true
            gradle=true
            shell=true
            webui=true
            module=true
            android_app=true
            build=true
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "gradle=$gradle" >> "$GITHUB_OUTPUT"
          echo "shell=$shell" >> "$GITHUB_OUTPUT"
          echo "webui=$webui" >> "$GITHUB_OUTPUT"
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "android_app=$android_app" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Summarize detected scope
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Detected change scope

          | Scope | Run |
          | --- | --- |
          | Rust | `${{ steps.filter.outputs.rust }}` |
          | Gradle / Android source | `${{ steps.filter.outputs.gradle }}` |
          | Shell | `${{ steps.filter.outputs.shell }}` |
          | WebUI | `${{ steps.filter.outputs.webui }}` |
          | Module artifact | `${{ steps.filter.outputs.module }}` |
          | Encryptor APK | `${{ steps.filter.outputs.android_app }}` |
          | Heavy build job | `${{ steps.filter.outputs.build }}` |
          EOF

  quality-gate:
    name: "🛡️ Quality Gate & Linting"
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify immutable GitHub Action references
        shell: bash
        run: |
          set -euo pipefail
          unpinned=$(
            grep -R -nE '^[[:space:]]*uses:[[:space:]]*[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+(/[^@[:space:]]+)*@' .github/workflows \
              | grep -Ev '@[0-9a-f]{40}([[:space:]]|$)' || true
          )
          if [[ -n "$unpinned" ]]; then
            echo "::error::External GitHub Actions must use a full commit SHA"
            printf '%s\n' "$unpinned"
            exit 1
          fi

      - name: Validate Bouncy Castle coordinates
        if: needs.changes.outputs.gradle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in bcpkix-jdk18on bcprov-jdk18on; do
            version=$(sed -n "s/^${artifact} = \"\([^\"]*\)\"/\1/p" gradle/libs.versions.toml | head -n1)
            if [[ -z "$version" ]]; then
              echo "::error::Missing version for $artifact"
              exit 1
            fi
            url="https://repo.maven.apache.org/maven2/org/bouncycastle/${artifact}/${version}/${artifact}-${version}.pom"
            echo "Checking $artifact:$version"
            curl --fail --silent --show-error --location --user-agent "CleveresTricky-CI/1.0" --retry 3 --retry-all-errors --output /dev/null "$url"
          done

      - name: Setup Java
        if: needs.changes.outputs.gradle == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: needs.changes.outputs.gradle == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        if: needs.changes.outputs.gradle == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: "🐚 Shell Script Linting (Shellcheck)"
        if: needs.changes.outputs.shell == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck module/template/*.sh

      - name: "🎨 Kotlin Format & Quality (Ktlint)"
        if: needs.changes.outputs.gradle == 'true'
        run: ./gradlew ktlintCheck --warning-mode=fail --console=plain

      - name: "📱 Android Static Analysis (Lint)"
        if: needs.changes.outputs.gradle == 'true'
        id: android_lint
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tasks=()
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "${{ needs.changes.outputs.module }}" == "true" ]]; then
            tasks+=(":service:lintDebug" ":stub:lintDebug")
          fi
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || "${{ needs.changes.outputs.android_app }}" == "true" ]]; then
            tasks+=(":encryptor-app:lintDebug")
          fi
          if [[ "${#tasks[@]}" -eq 0 ]]; then
            echo "No Android lint targets affected"
            exit 0
          fi
          ./gradlew "${tasks[@]}" --warning-mode=fail --console=plain --continue

      - name: Show Android Lint failures
        if: steps.android_lint.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r report; do
            found=true
            echo "===== $report ====="
            cat "$report"
          done < <(find service stub encryptor-app -type f -name 'lint-results-*.txt' -print | sort)
          if [[ "$found" != "true" ]]; then
            echo "::warning::Android Lint failed but no text report was found"
          fi

      - name: Enforce Android Lint result
        if: steps.android_lint.outcome == 'failure'
        run: exit 1

      - name: Native source and documentation policy
        shell: bash
        run: |
          set -euo pipefail
          unexpected_native=$(find . -type f \
            \( -name '*.c' -o -name '*.C' -o -name '*.cc' -o -name '*.cpp' \
               -o -name '*.cxx' -o -name '*.c++' -o -name '*.m' -o -name '*.mm' \
               -o -name '*.ixx' -o -name '*.cppm' \) \
            ! -path './.git/*' \
            ! -path '*/build/*' \
            ! -path './rust/target/*' \
            ! -path './module/src/main/cpp/external/*' \
            ! -path './module/src/main/cpp/binder_interceptor.cpp' -print)
          if [ -n "$unexpected_native" ]; then
            echo "::error::Unexpected first party C or C++ source detected"
            printf '%s\n' "$unexpected_native"
            exit 1
          fi

          unexpected_headers=$(find . -type f \
            \( -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \
               -o -name '*.h++' -o -name '*.inc' -o -name '*.inl' \
               -o -name '*.ipp' -o -name '*.tpp' \) \
            ! -path './.git/*' \
            ! -path '*/build/*' \
            ! -path './rust/target/*' \
            ! -path './module/src/main/cpp/external/*' -print | while IFS= read -r header; do
              case "$header" in
                './module/src/main/cpp/binder/include/binder/Binder.h'|\
                './module/src/main/cpp/binder/include/binder/Common.h'|\
                './module/src/main/cpp/binder/include/binder/IBinder.h'|\
                './module/src/main/cpp/binder/include/binder/IPCThreadState.h'|\
                './module/src/main/cpp/binder/include/binder/Parcel.h'|\
                './module/src/main/cpp/binder/include/binder/unique_fd.h'|\
                './module/src/main/cpp/binder/include/kernel/binder.h'|\
                './module/src/main/cpp/binder/include/utils/Errors.h'|\
                './module/src/main/cpp/binder/include/utils/RefBase.h'|\
                './module/src/main/cpp/binder/include/utils/String16.h'|\
                './module/src/main/cpp/binder/include/utils/StrongPointer.h'|\
                './module/src/main/cpp/binder/include/utils/Vector.h'|\
                './rust/native-core/include/cleverestricky_native_core.h') ;;
                *) printf '%s\n' "$header" ;;
              esac
            done)
          if [ -n "$unexpected_headers" ]; then
            echo "::error::Unexpected first party native header detected"
            printf '%s\n' "$unexpected_headers"
            exit 1
          fi

          long_dash_pattern=$(printf '\342\200\224|\342\200\223')
          # Localized user-facing copy legitimately uses locale-specific punctuation.
          # Localization tests independently enforce source-key parity and completeness.
          if grep -RInE --exclude-dir=.git --exclude-dir=build --exclude-dir=target --exclude=ux.js \
            "$long_dash_pattern" .; then
            echo "::error::Unsupported long dash character detected"
            exit 1
          fi

  rust-test:
    name: "🦀 Rust Checks & Tests"
    runs-on: ubuntu-latest
    needs: [changes, quality-gate]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' }}
    env:
      RUSTFLAGS: "-D warnings"
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Security Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    name: "🛠️ Build Module"
    runs-on: ubuntu-latest
    needs: [changes, quality-gate, rust-test]
    if: ${{ always() && needs.quality-gate.result == 'success' && (needs.rust-test.result == 'success' || needs.rust-test.result == 'skipped') && (github.event_name != 'pull_request' || needs.changes.outputs.build == 'true') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "🔒 SELinux Policy Validation"
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.module == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          errors=0
          line_num=0
          while IFS= read -r line; do
            line_num=$((line_num + 1))
            trimmed=$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$trimmed" ] && continue
            [[ "$trimmed" == \#* ]] && continue
            [[ "$trimmed" == type\ * ]] && continue
            if [[ "$trimmed" =~ ^(allow|dontaudit|neverallow|auditallow)[[:space:]] ]]; then
              statement=$(printf '%s' "$trimmed" | sed 's/#.*//;s/[[:space:]]*$//')
              if [[ "$statement" != *";" ]]; then
                echo "::error file=module/template/sepolicy.rule,line=$line_num::Missing semicolon: $trimmed"
                errors=$((errors + 1))
              fi
            fi
          done < module/template/sepolicy.rule
          [ "$errors" -eq 0 ]

      - name: "📱 KernelSU/APatch Module Structure Validation"
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.module == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          errors=0
          for f in module.prop customize.sh verify.sh service.sh post-fs-data.sh action.sh sepolicy.rule webroot/index.html webroot/bridge.js webroot/policy.js webroot/ux.js; do
            if [ ! -f "module/template/$f" ]; then
              echo "::error::Missing required module file: module/template/$f"
              errors=$((errors + 1))
            fi
          done
          for script in module/template/customize.sh module/template/verify.sh module/template/service.sh module/template/post-fs-data.sh module/template/action.sh; do
            if [ -f "$script" ] && ! bash -n "$script"; then
              echo "::error file=$script::Shell syntax error"
              errors=$((errors + 1))
            fi
          done
          [ "$errors" -eq 0 ]

      - name: Native WebUI syntax validation
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.webui == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check module/template/webroot/bridge.js
          node --check module/template/webroot/policy.js
          node --check module/template/webroot/ux.js
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('module/template/webroot/index.html', 'utf8')
          const policyScripts = [...html.matchAll(/<script[^>]*\bsrc=["']policy\.js(?:\?[^"']*)?["'][^>]*>/gi)]
          if (policyScripts.length !== 1) throw new Error('Expected exactly one policy.js script entrypoint')
          const blocks = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
          if (blocks.length !== 1) throw new Error('Unexpected inline script count')
          new Function(blocks[0][2])
          NODE

      - name: Native WebUI behavior tests
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.webui == 'true' }}
        env:
          NODE_OPTIONS: --throw-deprecation
        run: node module/webui-tests/bridge.test.js

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Rust toolchain
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.module == 'true' }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Lint Android Rust targets
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' }}
        working-directory: rust
        run: |
          cargo clippy --workspace --all-targets --target aarch64-linux-android -- -D warnings
          cargo clippy --workspace --all-targets --target x86_64-linux-android -- -D warnings

      - name: Run Unit Tests
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.gradle == 'true' || needs.changes.outputs.module == 'true' || needs.changes.outputs.android_app == 'true' }}
        id: unit_tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            ./gradlew testDebugUnitTest --warning-mode=fail --console=plain --stacktrace --no-build-cache --rerun-tasks
            exit 0
          fi

          tasks=()
          if [[ "${{ needs.changes.outputs.module }}" == "true" ]]; then
            tasks+=(":service:testDebugUnitTest" ":stub:testDebugUnitTest")
          fi
          if [[ "${{ needs.changes.outputs.android_app }}" == "true" ]]; then
            tasks+=(":encryptor-app:testDebugUnitTest")
          fi
          if [[ "${#tasks[@]}" -eq 0 ]]; then
            echo "No Android unit test targets affected"
            exit 0
          fi
          ./gradlew "${tasks[@]}" --warning-mode=fail --console=plain --stacktrace --no-build-cache --rerun-tasks

      - name: Upload failed test reports
        if: ${{ failure() && steps.unit_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failed-unit-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Module Artifact
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.module == 'true' }}
        run: ./gradlew zipRelease --warning-mode=fail --console=plain

      - name: Build Encryptor App
        if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.android_app == 'true' }}
        run: ./gradlew :encryptor-app:assembleRelease --warning-mode=fail --console=plain

      - name: Build signed Encryptor App
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in RELEASE_KEYSTORE RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/encryptor-release.jks"
          store_listing="$RUNNER_TEMP/encryptor-release-store.txt"
          alias_listing="$RUNNER_TEMP/encryptor-release-alias.txt"
          trap 'rm -f "$keystore" "$store_listing" "$alias_listing"' EXIT

          if ! printf '%s' "$RELEASE_KEYSTORE" \
            | tr -d '[:space:]' \
            | base64 --decode > "$keystore"; then
            echo "::error::RELEASE_KEYSTORE is not valid base64-encoded keystore data"
            exit 1
          fi
          chmod 600 "$keystore"
          if [[ ! -s "$keystore" ]]; then
            echo "::error::RELEASE_KEYSTORE decoded to an empty file"
            exit 1
          fi

          keytool_args=(
            -J-Duser.language=en
            -J-Duser.country=US
            -list
            -v
            -keystore "$keystore"
            -storepass "$RELEASE_KEY_PASSWORD"
          )
          if ! keytool "${keytool_args[@]}" > "$store_listing" 2>&1; then
            echo "::error::RELEASE_KEYSTORE could not be opened with RELEASE_KEY_PASSWORD"
            exit 1
          fi

          release_key_alias="$RELEASE_KEY_ALIAS"
          if ! keytool "${keytool_args[@]}" -alias "$release_key_alias" > "$alias_listing" 2>&1 \
            || ! grep -Fx 'Entry type: PrivateKeyEntry' "$alias_listing" >/dev/null; then
            mapfile -t private_key_aliases < <(
              awk -F': ' \
                '/^Alias name: / { alias = substr($0, index($0, ":") + 2) } \
                 /^Entry type: PrivateKeyEntry$/ { print alias }' \
                "$store_listing"
            )
            if [[ "${#private_key_aliases[@]}" -ne 1 ]]; then
              echo "::error::RELEASE_KEY_ALIAS is not a private-key entry and the keystore does not contain exactly one usable private key"
              exit 1
            fi
            release_key_alias="${private_key_aliases[0]}"
            echo "::add-mask::$release_key_alias"
            echo "::warning::RELEASE_KEY_ALIAS did not match; using the keystore's only private-key entry"
          fi

          ORG_GRADLE_PROJECT_ENCRYPTOR_RELEASE_KEYSTORE="$keystore" \
          ORG_GRADLE_PROJECT_ENCRYPTOR_RELEASE_STORE_PASSWORD="$RELEASE_KEY_PASSWORD" \
          ORG_GRADLE_PROJECT_ENCRYPTOR_RELEASE_KEY_ALIAS="$release_key_alias" \
          ORG_GRADLE_PROJECT_ENCRYPTOR_RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD" \
            ./gradlew :encryptor-app:assembleRelease --warning-mode=fail --console=plain

      - name: Verify Encryptor APK signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk="encryptor-app/build/outputs/apk/release/encryptor-app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "::error::Signed Encryptor APK is missing: $apk"
            find encryptor-app/build/outputs/apk/release -maxdepth 1 -type f -print || true
            exit 1
          fi
          if compgen -G 'encryptor-app/build/outputs/apk/release/*-unsigned.apk' >/dev/null; then
            echo "::error::Unsigned Encryptor APK output detected"
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Verify module archive layout and checksums
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.module == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          variant=release
          archives=(module/release/*-"$variant".zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one $variant module zip, found ${#archives[@]}"
            exit 1
          fi
          archive="${archives[0]}"
          unzip -tq "$archive" >/dev/null
          entries=$(unzip -Z1 "$archive")
          duplicates=$(printf '%s\n' "$entries" | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error file=$archive::Duplicate ZIP entries are not allowed"
            printf '%s\n' "$duplicates"
            exit 1
          fi
          while IFS= read -r entry; do
            case "$entry" in
              /*|../*|*/../*|*/..|*\\*)
                echo "::error file=$archive::Unsafe ZIP entry: $entry"
                exit 1
                ;;
            esac
          done <<<"$entries"
          for required in module.prop customize.sh verify.sh service.sh post-fs-data.sh action.sh sepolicy.rule; do
            if ! grep -Fx "$required" <<<"$entries" >/dev/null; then
              echo "::error file=$archive::Missing required root entry: $required"
              exit 1
            fi
          done

          target="$work/$variant"
          mkdir -p "$target"
          unzip -q "$archive" -d "$target"
          while IFS= read -r -d '' payload; do
            case "$payload" in
              *.sha256) continue ;;
            esac
            checksum="$payload.sha256"
            if [ ! -f "$checksum" ]; then
              echo "::error file=$archive::Missing checksum for ${payload#"$target/"}"
              exit 1
            fi
            expected=$(tr -d '[:space:]' < "$checksum")
            case "$expected" in
              ''|*[!0-9A-Fa-f]*)
                echo "::error file=$archive::Malformed checksum for ${payload#"$target/"}"
                exit 1
                ;;
            esac
            if [ "${#expected}" -ne 64 ]; then
              echo "::error file=$archive::Invalid checksum length for ${payload#"$target/"}"
              exit 1
            fi
            actual=$(sha256sum "$payload" | awk '{print $1}')
            if [ "${expected,,}" != "$actual" ]; then
              echo "::error file=$archive::Checksum mismatch for ${payload#"$target/"}"
              exit 1
            fi
          done < <(find "$target" -type f -print0)

          while IFS= read -r -d '' checksum; do
            payload=${checksum%.sha256}
            if [ ! -f "$payload" ]; then
              echo "::error file=$archive::Orphan checksum ${checksum#"$target/"}"
              exit 1
            fi
          done < <(find "$target" -type f -name '*.sha256' -print0)

      - name: Verify native artifact hardening
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.module == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            file=$1
            shift
            echo "::error file=$file::$*"
            exit 1
          }

          module_root=module/build/outputs/module/release/lib
          for abi in arm64-v8a x86_64; do
            injector="$module_root/$abi/inject"
            webui_bridge="$module_root/$abi/webui_bridge"
            library="$module_root/$abi/libcleverestricky.so"

            for binary in "$injector" "$webui_bridge" "$library"; do
              test -s "$binary" || fail "$binary" "Native artifact is missing or empty"
              program_headers=$(readelf -W -l "$binary")
              dynamic_section=$(readelf -W -d "$binary")
              grep -F 'GNU_RELRO' <<<"$program_headers" >/dev/null || \
                fail "$binary" "GNU_RELRO segment is missing"
              grep -F 'BIND_NOW' <<<"$dynamic_section" >/dev/null || \
                fail "$binary" "Immediate binding (BIND_NOW) is missing"
              if ! awk '
                $1 == "GNU_STACK" { found = 1; if ($0 ~ /RWE/) exit 2 }
                END { if (!found) exit 1 }
              ' <<<"$program_headers"; then
                fail "$binary" "GNU_STACK is missing or executable"
              fi
            done

            injector_headers=$(readelf -W -l "$injector")
            webui_headers=$(readelf -W -l "$webui_bridge")
            grep -F '/system/bin/linker64' <<<"$injector_headers" >/dev/null || \
              fail "$injector" "Unexpected Android program interpreter"
            grep -F '/system/bin/linker64' <<<"$webui_headers" >/dev/null || \
              fail "$webui_bridge" "Unexpected Android program interpreter"

            dyn_symbols=$(readelf -W --dyn-syms "$library")
            exports=$(awk '$5 == "GLOBAL" && $7 != "UND" && $8 != "" { print $8 }' \
              <<<"$dyn_symbols" | sort -u)
            expected_exports=$(printf 'entry\nresume')
            if [ "$exports" != "$expected_exports" ]; then
              actual=$(printf '%s\n' "$exports" | paste -sd ',' -)
              fail "$library" "Unexpected exported symbols: ${actual:-<none>} (expected: entry,resume)"
            fi
          done
          
      - name: Upload release module zip
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.module == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: "module/release/*-release.zip"
          if-no-files-found: error
          archive: false

      - name: Upload Encryptor App
        if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.android_app == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: EncryptorApp
          path: "encryptor-app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          compression-level: 0

  release:
    name: "📦 Publish Release"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release module zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "CleveresTricky-*-release.zip"
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Download Encryptor App
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: EncryptorApp
          path: release-assets

      - name: Verify release assets and create checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_zips=(release-assets/*-release.zip)
          apk="release-assets/encryptor-app-release.apk"
          [ "${#release_zips[@]}" -eq 1 ] || { echo "::error::Expected one release module zip"; exit 1; }
          [ -f "$apk" ] || { echo "::error::Signed Encryptor APK is missing"; exit 1; }
          if compgen -G 'release-assets/*-unsigned.apk' >/dev/null; then
            echo "::error::Unsigned Encryptor APK must never be published"
            exit 1
          fi
          unzip -tq "${release_zips[0]}" >/dev/null
          (
            cd release-assets
            sha256sum -- *-release.zip encryptor-app-release.apk | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Check release version
        id: release_version
        shell: bash
        run: |
          version=$(sed -n 's/^val verName = "[vV]\{0,1\}\([^"]*\)".*/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Could not read verName from build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/V$version" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest official release provenance
        if: steps.release_version.outputs.create == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Create tag and release
        if: steps.release_version.outputs.create == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: "V${{ steps.release_version.outputs.version }}"
          name: "Release V${{ steps.release_version.outputs.version }}"
          generate_release_notes: true
          files: "release-assets/*"
