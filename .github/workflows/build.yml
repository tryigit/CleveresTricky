name: Build

# Isolated same-repository runner for PR #953; this branch is never merged.
on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  pr953-fixup-runner:
    if: github.head_ref == 'agent/pr953-fixup-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR 953 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Patch raw published-keybox snapshot test seam
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          cert_path = Path('service/src/main/java/cleveres/tricky/cleverestech/keystore/CertHack.java')
          cert = cert_path.read_text()
          old = '''    public static int getKeyboxCount() {
                  if (!KeyboxLoader.isActiveSetHealthy()) {
                      throw new IllegalStateException("Rust keybox backend activation is unavailable");
                  }
                  int count = 0;
                  for (List<KeyBox> list : state.keyboxes.values()) count += list.size();
                  return count;
              }
          '''
          new = '''    public static int getKeyboxCount() {
                  if (!KeyboxLoader.isActiveSetHealthy()) {
                      throw new IllegalStateException("Rust keybox backend activation is unavailable");
                  }
                  return getPublishedKeyboxCountForTesting();
              }

              /**
               * JVM-unit-test seam for inspecting the already-published managed snapshot without
               * probing backend health or triggering backend recovery.
               */
              public static int getPublishedKeyboxCountForTesting() {
                  int count = 0;
                  for (List<KeyBox> list : state.keyboxes.values()) count += list.size();
                  return count;
              }
          '''
          if cert.count(old) != 1:
              raise SystemExit(f'CertHack keybox-count block count: {cert.count(old)}')
          cert_path.write_text(cert.replace(old, new, 1))

          test_path = Path('service/src/test/java/cleveres/tricky/cleverestech/WebServerUploadTest.kt')
          test = test_path.read_text()
          test = test.replace(
              '        val activeKeyboxCount = cleveres.tricky.cleverestech.keystore.CertHack.getKeyboxCount()\n',
              '        val activeKeyboxCount = cleveres.tricky.cleverestech.keystore.CertHack.getPublishedKeyboxCountForTesting()\n',
              1,
          )
          old = '''        // Activation failure intentionally marks backend health false. Reset only the test seam so
                  // getKeyboxCount can inspect the immutable managed snapshot without publishing new keys.
                  KeyboxLoader.resetForTesting()
                  assertEquals(activeKeyboxCount, cleveres.tricky.cleverestech.keystore.CertHack.getKeyboxCount())
          '''
          new = '''        assertEquals(
                  activeKeyboxCount,
                  cleveres.tricky.cleverestech.keystore.CertHack.getPublishedKeyboxCountForTesting(),
              )
          '''
          if test.count(old) != 1:
              raise SystemExit(f'WebServerUploadTest snapshot block count: {test.count(old)}')
          test_path.write_text(test.replace(old, new, 1))
          PY

      - name: Run failing keybox regression first
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest --tests 'cleveres.tricky.cleverestech.WebServerUploadTest.testValidUploadDoesNotReportSuccessWhenBackendActivationFails' --warning-mode=fail --console=plain --no-build-cache

      - name: Run service unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest --warning-mode=fail --console=plain --no-build-cache

      - name: Commit and push PR 953
        shell: bash
        run: |
          set -euo pipefail
          git add service/src/main/java/cleveres/tricky/cleverestech/keystore/CertHack.java \
                  service/src/test/java/cleveres/tricky/cleverestech/WebServerUploadTest.kt
          git diff --cached --check
          git commit -m 'test: inspect published keybox snapshot without backend recovery'
          git push origin HEAD:agent/rust-first-service-redesign
