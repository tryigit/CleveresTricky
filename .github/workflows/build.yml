name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: "🛡️ Quality Gate & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: "🐚 Shell Script Linting (Shellcheck)"
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck module/template/*.sh

      - name: "🎨 Kotlin Format & Quality (Ktlint)"
        run: ./gradlew ktlintCheck

      - name: "📱 Android Static Analysis (Lint)"
        run: ./gradlew :service:lintDebug :stub:lintDebug :encryptor-app:lintDebug

      - name: Native source and documentation policy
        shell: bash
        run: |
          set -euo pipefail
          unexpected_native=$(find . -type f \
            \( -name '*.c' -o -name '*.C' -o -name '*.cc' -o -name '*.cpp' \
               -o -name '*.cxx' -o -name '*.c++' -o -name '*.m' -o -name '*.mm' \
               -o -name '*.ixx' -o -name '*.cppm' \) \
            ! -path './.git/*' \
            ! -path '*/build/*' \
            ! -path './rust/target/*' \
            ! -path './module/src/main/cpp/external/*' \
            ! -path './module/src/main/cpp/binder_interceptor.cpp' -print)
          if [ -n "$unexpected_native" ]; then
            echo "::error::Unexpected first party C or C++ source detected"
            printf '%s\n' "$unexpected_native"
            exit 1
          fi

          unexpected_headers=$(find . -type f \
            \( -name '*.h' -o -name '*.hh' -o -name '*.hpp' -o -name '*.hxx' \
               -o -name '*.h++' -o -name '*.inc' -o -name '*.inl' \
               -o -name '*.ipp' -o -name '*.tpp' \) \
            ! -path './.git/*' \
            ! -path '*/build/*' \
            ! -path './rust/target/*' \
            ! -path './module/src/main/cpp/external/*' -print | while IFS= read -r header; do
              case "$header" in
                './module/src/main/cpp/binder/include/binder/Binder.h'|\
                './module/src/main/cpp/binder/include/binder/Common.h'|\
                './module/src/main/cpp/binder/include/binder/IBinder.h'|\
                './module/src/main/cpp/binder/include/binder/IPCThreadState.h'|\
                './module/src/main/cpp/binder/include/binder/Parcel.h'|\
                './module/src/main/cpp/binder/include/binder/unique_fd.h'|\
                './module/src/main/cpp/binder/include/kernel/binder.h'|\
                './module/src/main/cpp/binder/include/utils/Errors.h'|\
                './module/src/main/cpp/binder/include/utils/RefBase.h'|\
                './module/src/main/cpp/binder/include/utils/String16.h'|\
                './module/src/main/cpp/binder/include/utils/StrongPointer.h'|\
                './module/src/main/cpp/binder/include/utils/Vector.h'|\
                './rust/native-core/include/cleverestricky_native_core.h') ;;
                *) printf '%s\n' "$header" ;;
              esac
            done)
          if [ -n "$unexpected_headers" ]; then
            echo "::error::Unexpected first party native header detected"
            printf '%s\n' "$unexpected_headers"
            exit 1
          fi

          long_dash_pattern=$(printf '\342\200\224|\342\200\223')
          if grep -RInE --exclude-dir=.git --exclude-dir=build --exclude-dir=target \
            "$long_dash_pattern" .; then
            echo "::error::Unsupported long dash character detected"
            exit 1
          fi
          if grep -RIn -- '-' README.md docs; then
            echo "::error::README and feature documents must not use dash characters"
            exit 1
          fi

  rust-test:
    name: "🦀 Rust Checks & Tests"
    runs-on: ubuntu-latest
    needs: quality-gate
    env:
      RUSTFLAGS: "-D warnings"
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Security Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  build:
    name: "🛠️ Build Module"
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: "🔒 SELinux Policy Validation"
        shell: bash
        run: |
          set -euo pipefail
          errors=0
          line_num=0
          while IFS= read -r line; do
            line_num=$((line_num + 1))
            trimmed=$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$trimmed" ] && continue
            [[ "$trimmed" == \#* ]] && continue
            [[ "$trimmed" == type\ * ]] && continue
            if [[ "$trimmed" =~ ^(allow|dontaudit|neverallow|auditallow)[[:space:]] ]]; then
              statement=$(printf '%s' "$trimmed" | sed 's/#.*//;s/[[:space:]]*$//')
              if [[ "$statement" != *";" ]]; then
                echo "::error file=module/template/sepolicy.rule,line=$line_num::Missing semicolon: $trimmed"
                errors=$((errors + 1))
              fi
            fi
          done < module/template/sepolicy.rule
          [ "$errors" -eq 0 ]

      - name: "📱 KernelSU/APatch Module Structure Validation"
        shell: bash
        run: |
          set -euo pipefail
          errors=0
          for f in module.prop customize.sh verify.sh service.sh post-fs-data.sh sepolicy.rule webroot/index.html webroot/bridge.js; do
            if [ ! -f "module/template/$f" ]; then
              echo "::error::Missing required module file: module/template/$f"
              errors=$((errors + 1))
            fi
          done
          if [ -e module/template/action.sh ]; then
            echo "::error::Legacy external WebUI launcher must not be packaged"
            errors=$((errors + 1))
          fi
          for script in module/template/customize.sh module/template/verify.sh module/template/service.sh module/template/post-fs-data.sh; do
            if [ -f "$script" ] && ! bash -n "$script"; then
              echo "::error file=$script::Shell syntax error"
              errors=$((errors + 1))
            fi
          done
          [ "$errors" -eq 0 ]

      - name: Native WebUI syntax validation
        shell: bash
        run: |
          set -euo pipefail
          node --check module/template/webroot/bridge.js
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('module/template/webroot/index.html', 'utf8')
          const blocks = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
          if (blocks.length !== 1) throw new Error('Unexpected inline script count')
          new Function(blocks[0][2])
          NODE

      - name: Native WebUI behavior tests
        run: node module/webui-tests/bridge.test.js

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Lint Android Rust targets
        working-directory: rust
        run: |
          cargo clippy --workspace --all-targets --target aarch64-linux-android -- -D warnings
          cargo clippy --workspace --all-targets --target x86_64-linux-android -- -D warnings

      - name: Run Unit Tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Upload failed test reports
        if: ${{ failure() && steps.unit_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-unit-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Android Artifacts
        run: |
          ./gradlew zipRelease
          ./gradlew zipDebug
          ./gradlew :encryptor-app:assembleRelease

      - name: Verify module archive layout
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for variant in release debug; do
            archives=(module/release/*-"$variant".zip)
            if [ "${#archives[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $variant module zip, found ${#archives[@]}"
              exit 1
            fi
            archive="${archives[0]}"
            unzip -tq "$archive" >/dev/null
            entries=$(unzip -Z1 "$archive")
            for required in module.prop customize.sh verify.sh service.sh post-fs-data.sh sepolicy.rule; do
              if ! grep -Fx "$required" <<<"$entries" >/dev/null; then
                echo "::error file=$archive::Missing required root entry: $required"
                exit 1
              fi
            done
          done

      - name: Verify native artifact hardening
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            file=$1
            shift
            echo "::error file=$file::$*"
            exit 1
          }

          module_root=module/build/outputs/module/release/lib
          for abi in arm64-v8a x86_64; do
            injector="$module_root/$abi/inject"
            webui_bridge="$module_root/$abi/webui_bridge"
            library="$module_root/$abi/libcleverestricky.so"

            for binary in "$injector" "$webui_bridge" "$library"; do
              test -s "$binary" || fail "$binary" "Native artifact is missing or empty"
              program_headers=$(readelf -W -l "$binary")
              dynamic_section=$(readelf -W -d "$binary")
              grep -F 'GNU_RELRO' <<<"$program_headers" >/dev/null || \
                fail "$binary" "GNU_RELRO segment is missing"
              grep -F 'BIND_NOW' <<<"$dynamic_section" >/dev/null || \
                fail "$binary" "Immediate binding (BIND_NOW) is missing"
              if ! awk '
                $1 == "GNU_STACK" { found = 1; if ($0 ~ /RWE/) exit 2 }
                END { if (!found) exit 1 }
              ' <<<"$program_headers"; then
                fail "$binary" "GNU_STACK is missing or executable"
              fi
            done

            injector_headers=$(readelf -W -l "$injector")
            webui_headers=$(readelf -W -l "$webui_bridge")
            grep -F '/system/bin/linker64' <<<"$injector_headers" >/dev/null || \
              fail "$injector" "Unexpected Android program interpreter"
            grep -F '/system/bin/linker64' <<<"$webui_headers" >/dev/null || \
              fail "$webui_bridge" "Unexpected Android program interpreter"

            dyn_symbols=$(readelf -W --dyn-syms "$library")
            exports=$(awk '$5 == "GLOBAL" && $7 != "UND" && $8 != "" { print $8 }' \
              <<<"$dyn_symbols" | sort -u)
            expected_exports=$(printf 'entry\nresume')
            if [ "$exports" != "$expected_exports" ]; then
              actual=$(printf '%s\n' "$exports" | paste -sd ',' -)
              fail "$library" "Unexpected exported symbols: ${actual:-<none>} (expected: entry,resume)"
            fi
          done

      - name: Upload release module zip
        uses: actions/upload-artifact@v7
        with:
          path: "module/release/*-release.zip"
          if-no-files-found: error
          archive: false

      - name: Upload debug module zip
        uses: actions/upload-artifact@v7
        with:
          path: "module/release/*-debug.zip"
          if-no-files-found: error
          archive: false

      - name: Upload Encryptor App
        uses: actions/upload-artifact@v7
        with:
          name: EncryptorApp
          path: "encryptor-app/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          compression-level: 0

  release:
    name: "📦 Publish Release"
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release module zip
        uses: actions/download-artifact@v8
        with:
          pattern: "CleveresTricky-*-release.zip"
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Download debug module zip
        uses: actions/download-artifact@v8
        with:
          pattern: "CleveresTricky-*-debug.zip"
          path: release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Download Encryptor App
        uses: actions/download-artifact@v8
        with:
          name: EncryptorApp
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          release_zips=(release-assets/*-release.zip)
          debug_zips=(release-assets/*-debug.zip)
          apks=(release-assets/*.apk)
          [ "${#release_zips[@]}" -eq 1 ] || { echo "::error::Expected one release module zip"; exit 1; }
          [ "${#debug_zips[@]}" -eq 1 ] || { echo "::error::Expected one debug module zip"; exit 1; }
          [ "${#apks[@]}" -ge 1 ] || { echo "::error::Encryptor APK is missing"; exit 1; }
          unzip -tq "${release_zips[0]}" >/dev/null
          unzip -tq "${debug_zips[0]}" >/dev/null

      - name: Check release version
        id: release_version
        shell: bash
        run: |
          version=$(sed -n 's/^val verName by extra("[vV]\{0,1\}\([^"]*\)").*/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::Could not read verName from build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/V$version" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and release
        if: steps.release_version.outputs.create == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "V${{ steps.release_version.outputs.version }}"
          name: "Release V${{ steps.release_version.outputs.version }}"
          generate_release_notes: true
          files: "release-assets/*"
