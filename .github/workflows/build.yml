name: Build

# Isolated same-repository runner for PR #953; this branch is never merged.
on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  pr953-fixup-runner:
    if: github.head_ref == 'agent/pr953-fixup-runner'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR 953 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/rust-first-service-redesign
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Isolate WebServer keybox test state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('service/src/test/java/cleveres/tricky/cleverestech/WebServerUploadTest.kt')
          text = path.read_text()

          old = '''        configDir = tempFolder.newFolder("config")
                  ManagedKeyboxParserOracle.install()
          '''
          new = '''        configDir = tempFolder.newFolder("config")
                  KeyboxLoader.resetForTesting()
                  cleveres.tricky.cleverestech.keystore.CertHack.setKeyboxes(emptyList())
                  ManagedKeyboxParserOracle.install()
          '''
          if text.count(old) != 1:
              raise SystemExit(f'setUp isolation block count: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        KeyboxLoader.activeSetOverride = null
                  BackendRecovery.recoveryOverride = null
                  ManagedKeyboxParserOracle.reset()
          '''
          new = '''        KeyboxLoader.resetForTesting()
                  BackendRecovery.recoveryOverride = null
                  cleveres.tricky.cleverestech.keystore.CertHack.setKeyboxes(emptyList())
                  ManagedKeyboxParserOracle.reset()
          '''
          if text.count(old) != 1:
              raise SystemExit(f'tearDown isolation block count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run failing keybox regression first
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest --tests 'cleveres.tricky.cleverestech.WebServerUploadTest.testValidUploadDoesNotReportSuccessWhenBackendActivationFails' --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Run exact Security Regression JVM suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest :stub:testDebugUnitTest :encryptor-app:testDebugUnitTest --warning-mode=fail --console=plain --stacktrace --no-build-cache

      - name: Commit and push PR 953
        shell: bash
        run: |
          set -euo pipefail
          git add service/src/test/java/cleveres/tricky/cleverestech/WebServerUploadTest.kt
          git diff --cached --check
          git commit -m 'test: isolate WebServer keybox activation state'
          git push origin HEAD:agent/rust-first-service-redesign
