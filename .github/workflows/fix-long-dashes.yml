name: Fix unsupported long dashes

on:
  push:
    branches:
      - fix/reboot-pending-indicators

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Normalize unsupported dash characters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('module/template/webroot/ux-core.js')
          s = p.read_text(encoding='utf-8')
          normalized = s.replace('\u2013', '-').replace('\u2014', '-').replace('\u2015', '-')
          if normalized == s:
              raise SystemExit('No unsupported long dash characters found')
          p.write_text(normalized, encoding='utf-8')
          PY

      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module/template/webroot/ux-core.js
          git rm .github/workflows/fix-long-dashes.yml
          git commit -m 'fix: normalize unsupported long dashes in WebUI strings'
          git push
