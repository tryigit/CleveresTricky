name: Verify policy branch

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :service:compileDebugKotlin :service:compileDebugJavaWithJavac --warning-mode=fail --stacktrace
