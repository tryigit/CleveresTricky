name: Refine policy integration patch

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          policy = Path('service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt')
          source = policy.read_text()
          source_old = '        val selected = selectProfile(packages, current).let { it.profile }\n'
          source_new = '        val selected = selectProfile(packages, current).profile\n'
          if source.count(source_old) != 1:
              raise SystemExit('policy resolver source mismatch')
          policy.write_text(source.replace(source_old, source_new, 1))
          workflow = Path('.github/workflows/apply-v2.yml')
          text = workflow.read_text()
          old = "          replace(policy, '        val selected = selectProfile(packages, current).profile\\n', '        val selected = resolvedUid.selection.profile\\n', 1)\n"
          new = "          replace(policy, '        if (!current.explicit) return Config.getAttestationPatchLevels(uid)\\n        val selected = selectProfile(packages, current).profile\\n', '        if (!current.explicit) return Config.getAttestationPatchLevels(uid)\\n        val selected = resolvedUid.selection.profile\\n')\n"
          if text.count(old) != 1:
              raise SystemExit('integration workflow target mismatch')
          workflow.write_text(text.replace(old, new, 1))
          Path('.github/workflows/repair-apply-v2.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: refine policy integration patch"
          git push origin HEAD:granular-policy-state-v2
