name: Run final policy test staging

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .tmp/finalize_policy_tests.py
      - shell: bash
        run: |
          set -euo pipefail
          rm .tmp/finalize_policy_tests.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt service/src/test/java/cleveres/tricky/cleverestech/PolicyStateTest.kt docs/BackupRestore.md .tmp/finalize_policy_tests.py
          git commit -m "test: complete policy lifecycle coverage"
          git push origin HEAD:granular-policy-state-v2
