name: Diagnose Profile Sources

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Locate profile implementation
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Profile-related files ==="
          find . -type f -not -path './.git/*' | sort | grep -Ei 'profile|preset' || true
          echo "=== Profile implementation strings ==="
          grep -R -n -E 'GodProfile|DailyUse|APPLY_PROFILE_FILE|apply_profile' . --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build || true
