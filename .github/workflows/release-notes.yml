name: Release Notes Sync

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-notes-master
  cancel-in-progress: false

env:
  NO_COLOR: "1"
  GH_FORCE_COLOR: "0"
  GH_FORCE_TTY: "0"
  GH_PAGER: cat

jobs:
  sync-release-notes:
    name: "📝 Sync Release Notes"
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: master

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^val verName = "\([vV][^"]*\)".*/\1/p' build.gradle.kts)
          if [[ -z "$version" ]]; then
            echo "::error::Could not read verName from build.gradle.kts"
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare canonical release body
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          previous=$(git tag --list 'V*' --sort=-version:refname | awk -v current="$RELEASE_TAG" '$0 != current { print; exit }')
          if [[ -z "$previous" ]]; then
            echo "::error::Could not determine previous release tag"
            exit 1
          fi
          PREVIOUS_TAG="$previous" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          previous = os.environ["PREVIOUS_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(rf"(?ms)^## {re.escape(tag)}\s*\n(?P<body>.*?)(?=^## V|\Z)", changelog)
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {tag}")
          body = match.group("body").strip()
          Path("release-notes.md").write_text(
              "## What's Changed\n\n"
              f"{body}\n\n"
              f"**Full Changelog**: https://github.com/{repo}/compare/{previous}...{tag}\n"
          )
          PY

      - name: Update existing GitHub Release body
        id: sync_body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG is missing after the successful Build workflow"
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $RELEASE_TAG" \
            --notes-file release-notes.md

      - name: Verify canonical release body was published
        if: steps.sync_body.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > "$RUNNER_TEMP/published-release-body.md"
          python3 - "$RUNNER_TEMP/published-release-body.md" <<'PY'
          import sys
          from pathlib import Path
          canonical = Path("release-notes.md").read_text().strip()
          published = Path(sys.argv[1]).read_text().strip()
          if canonical != published:
              print(f"Published release body does not match canonical release notes:\nCanonical:\n{canonical}\n\nPublished:\n{published}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Update update.json from published release artifact
        if: steps.sync_body.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          current_master=$(git ls-remote origin refs/heads/master | awk 'NR == 1 { print $1 }')
          if [[ -n "${BUILD_SHA:-}" && "$current_master" != "$BUILD_SHA" ]]; then
            echo "Build $BUILD_SHA is stale; current master is $current_master. Skipping metadata commit."
            exit 0
          fi

          release_json=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)

          mapfile -t matching_zips < <(jq -r --arg prefix "CleveresTricky-${RELEASE_TAG}-" '
            [.assets[] | select(.name | startswith($prefix) and endswith(".zip"))]
            | sort_by(.createdAt) | reverse | .[].name
          ' <<<"$release_json")

          if [[ ${#matching_zips[@]} -eq 0 ]]; then
            echo "No module release ZIP found for $RELEASE_TAG. Skipping metadata update."
            exit 0
          fi

          zip_name="${matching_zips[0]}"

          for remnant in "${matching_zips[@]:1}"; do
            echo "Deleting remnant asset: $remnant"
            gh release delete-asset "$RELEASE_TAG" "$remnant" --repo "$GITHUB_REPOSITORY" --yes || true
          done
          expected_digest=$(jq -r --arg name "$zip_name" '
            [.assets[] | select(.name == $name) | .digest]
            | if length == 1 then .[0] else error("module release ZIP digest is missing") end
          ' <<<"$release_json")
          case "$expected_digest" in
            sha256:*) expected_digest="${expected_digest#sha256:}" ;;
            *) echo "::error::Published ZIP has no SHA-256 digest"; exit 1 ;;
          esac

          artifact_dir="$RUNNER_TEMP/release-artifact"
          mkdir -p "$artifact_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$zip_name" \
            --dir "$artifact_dir"
          zip_path="$artifact_dir/$zip_name"
          actual_digest=$(sha256sum "$zip_path" | awk '{ print $1 }')
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            echo "::error::Downloaded release ZIP digest does not match GitHub asset digest"
            exit 1
          fi

          version_code=$(unzip -p "$zip_path" module.prop | sed -n 's/^versionCode=//p')
          if [[ ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read numeric versionCode from published module.prop"
            exit 1
          fi
          asset_stem="${zip_name%.zip}"
          artifact_suffix="${asset_stem#CleveresTricky-${RELEASE_TAG}-}"
          if [[ "$artifact_suffix" == "$asset_stem" || ! "$artifact_suffix" =~ ^${version_code}-.+-release$ ]]; then
            echo "::error::Published ZIP name does not match its versionCode"
            exit 1
          fi

          metadata_version="${RELEASE_TAG} (${artifact_suffix})"
          zip_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${zip_name}"
          changelog_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/refs/heads/master/CHANGELOG.md"
          tmp="$RUNNER_TEMP/update.json"
          jq \
            --arg version "$metadata_version" \
            --argjson versionCode "$version_code" \
            --arg zipUrl "$zip_url" \
            --arg changelog "$changelog_url" \
            '.version = $version | .versionCode = $versionCode | .zipUrl = $zipUrl | .changelog = $changelog' \
            update.json > "$tmp"

          if diff -u <(jq -S . update.json) <(jq -S . "$tmp") >/dev/null; then
            echo "update.json already matches the published release artifact"
            exit 0
          fi
          mv "$tmp" update.json

          file_sha=$(git rev-parse HEAD:update.json)
          b64_content=$(base64 -w 0 update.json)
          commit_msg="docs(release): sync $RELEASE_TAG update metadata [skip ci]"

          payload_file="$RUNNER_TEMP/commit_payload.json"
          jq -n \
            --arg msg "$commit_msg" \
            --arg content "$b64_content" \
            --arg sha "$file_sha" \
            --arg branch "master" \
            '{ message: $msg, content: $content, sha: $sha, branch: $branch }' > "$payload_file"

          # Publish metadata directly to master via GitHub API to ensure the commit is
          # signed and accepted by branch protection rules.
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/"$GITHUB_REPOSITORY"/contents/update.json \
            --input "$payload_file"
