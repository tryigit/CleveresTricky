          replace(policy, '    private data class Snapshot(', '    internal data class Snapshot(')
          replace(policy, '    private data class SelectedProfile(\n        val profile: Profile?,\n        val matchedPackage: String?,\n        val conflict: Boolean,\n    )\n', '    private data class SelectedProfile(\n        val profile: Profile?,\n        val matchedPackage: String?,\n        val conflict: Boolean,\n    )\n\n    private data class UidResolution(\n        val generation: Long,\n        val packages: Array<String>,\n        val selection: SelectedProfile,\n        val features: FeatureSet,\n    )\n')
          replace(policy, '    private val capturedByPackage = ConcurrentHashMap<String, CapturedPatch>()\n', '    private val capturedByPackage = ConcurrentHashMap<String, CapturedPatch>()\n    private val uidResolutionCache = ConcurrentHashMap<Int, UidResolution>()\n')
