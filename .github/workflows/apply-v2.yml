name: Apply policy integration

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply integration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          def replace_regex(path, pattern, repl, count=1):
              p = Path(path)
              text = p.read_text()
              updated, actual = re.subn(pattern, repl, text, count=count, flags=re.S)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} regex replacement(s), found {actual}: {pattern[:80]!r}")
              p.write_text(updated)

          config = 'service/src/main/java/cleveres/tricky/cleverestech/Config.kt'
          replace(config, '    fun getAppConfig(uid: Int): AppSpoofConfig? {\n        val state = appConfigState\n', '    fun getAppConfig(uid: Int): AppSpoofConfig? {\n        PolicyState.profileAppConfig(uid)?.let { return it }\n        val state = appConfigState\n')
          replace(config, '    fun getAppPrivacyMode(uid: Int): AppPrivacyMode {\n        val state = appConfigState\n', '    fun getAppPrivacyMode(uid: Int): AppPrivacyMode {\n        PolicyState.profilePrivacyMode(uid)?.let { return it }\n        val state = appConfigState\n')
          replace(config, '    val shouldInterceptTelephony: Boolean\n        get() = isSpoofEnabled && (isTelephonyEnabled || appConfigState.hasPrivacyRules)\n\n    fun shouldApplyTelephonyPrivacy(uid: Int): Boolean =\n        isSpoofEnabled &&\n            (isTelephonyEnabled || getAppPrivacyMode(uid) != AppPrivacyMode.INHERIT) &&\n            isTargetedUid(uid)\n', '    val shouldInterceptTelephony: Boolean\n        get() =\n            PolicyState.isFeatureEnabled(PolicyState.Feature.TELEPHONY_IDENTITY) ||\n                (isSpoofEnabled && appConfigState.hasPrivacyRules) ||\n                PolicyState.hasTelephonyProfileWork()\n\n    val shouldInterceptDrm: Boolean\n        get() = (isSpoofEnabled && appConfigState.hasPrivacyRules) || PolicyState.hasDrmProfileWork()\n\n    fun shouldApplyTelephonyPrivacy(uid: Int): Boolean {\n        val legacyPrivacy = !PolicyState.usesV2() && isSpoofEnabled && getAppPrivacyMode(uid) != AppPrivacyMode.INHERIT\n        val configuredPrivacy = PolicyState.usesV2() && getAppPrivacyMode(uid) != AppPrivacyMode.INHERIT\n        return (PolicyState.isFeatureEnabled(PolicyState.Feature.TELEPHONY_IDENTITY, uid) || legacyPrivacy || configuredPrivacy) &&\n            isTargetedUid(uid)\n    }\n')
          replace(config, '    fun getAttestationId(\n        tag: String,\n        uid: Int,\n    ): ByteArray? {\n        if (!isSpoofEnabled) return null\n', '    fun getAttestationId(\n        tag: String,\n        uid: Int,\n    ): ByteArray? {\n        if (!PolicyState.isFeatureEnabled(PolicyState.Feature.ATTESTATION_IDENTITY, uid)) return null\n')
          replace(config, '        isSpoofEnabled = enabled\n        KeyboxAutoCleaner.setEnabled', '        isSpoofEnabled = enabled\n        PolicyState.onLegacySettingsChanged()\n        KeyboxAutoCleaner.setEnabled')
          replace(config, '    private fun updateBuildIdentity(f: File?) {\n        isBuildIdentityEnabled = isRegularFlagFile(f)\n        Logger.i', '    private fun updateBuildIdentity(f: File?) {\n        isBuildIdentityEnabled = isRegularFlagFile(f)\n        PolicyState.onLegacySettingsChanged()\n        Logger.i')
          replace(config, '        isTelephonyEnabled = enabled\n        Logger.i', '        isTelephonyEnabled = enabled\n        PolicyState.onLegacySettingsChanged()\n        Logger.i')
          replace(config, '            securityPatchState = newState\n            dynamicPatchCache.clear()', '            securityPatchState = newState\n            PolicyState.onLegacySettingsChanged()\n            dynamicPatchCache.clear()')
          replace(config, '            RANDOM_ON_BOOT_FILE -> updateRandomOnBoot(file)\n            AUTO_KEYBOX_CHECK_FILE -> KeyboxAutoCleaner.setEnabled(file != null)\n', '            RANDOM_ON_BOOT_FILE -> {\n                PolicyState.onLegacySettingsChanged()\n                updateRandomOnBoot(file)\n            }\n            BootLogic.FILE_SPOOF_CN -> PolicyState.onLegacySettingsChanged()\n            PolicyState.STATE_FILE -> {\n                PolicyState.reload().getOrThrow()\n                updateRandomOnBoot(File(root, RANDOM_ON_BOOT_FILE))\n            }\n            AUTO_KEYBOX_CHECK_FILE -> KeyboxAutoCleaner.setEnabled(file != null)\n')
          replace(config, '            updateAppConfigs(restoredFile(APP_CONFIG_FILE)).getOrThrow()\n            refreshPrivacySeed().getOrThrow()\n', '            updateAppConfigs(restoredFile(APP_CONFIG_FILE)).getOrThrow()\n            PolicyState.reload().getOrThrow()\n            refreshPrivacySeed().getOrThrow()\n')
          replace(config, '        updateRandomOnBoot(File(root, RANDOM_ON_BOOT_FILE))\n        KeyboxAutoCleaner.setEnabled(isRegularFlagFile(File(root, AUTO_KEYBOX_CHECK_FILE)))\n', '        PolicyState.synchronizeBuiltInProfile()\n        updateRandomOnBoot(File(root, RANDOM_ON_BOOT_FILE))\n        KeyboxAutoCleaner.setEnabled(isRegularFlagFile(File(root, AUTO_KEYBOX_CHECK_FILE)))\n')
          replace(config, '    @Synchronized\n    private fun updateRandomOnBoot(f: File?) {\n        if (!isSpoofEnabled || !isRegularFlagFile(f)) {\n            discardStagedRandomization()\n            return\n        }\n', '    @Synchronized\n    private fun updateRandomOnBoot(f: File?) {\n        val enabled =\n            if (PolicyState.usesV2()) {\n                PolicyState.isFeatureEnabled(PolicyState.Feature.IDENTITY_REFRESH)\n            } else {\n                isSpoofEnabled && isRegularFlagFile(f)\n            }\n        if (!enabled) {\n            discardStagedRandomization()\n            return\n        }\n')
          replace(config, '                SECURITY_PATCH_FILE -> updateSecurityPatch(f)\n', '                SECURITY_PATCH_FILE -> updateSecurityPatch(f)\n                PolicyState.STATE_FILE -> {\n                    PolicyState.reload()\n                    updateRandomOnBoot(File(root, RANDOM_ON_BOOT_FILE))\n                }\n')
          replace(config, '                RANDOM_ON_BOOT_FILE -> updateRandomOnBoot(f)\n', '                RANDOM_ON_BOOT_FILE -> {\n                    PolicyState.onLegacySettingsChanged()\n                    updateRandomOnBoot(f)\n                }\n                BootLogic.FILE_SPOOF_CN -> PolicyState.onLegacySettingsChanged()\n')
          replace(config, '        updateSecurityPatch(File(root, SECURITY_PATCH_FILE))\n        updateAppConfigs(File(root, APP_CONFIG_FILE))\n        refreshPrivacySeed().getOrThrow()\n\n        updateRandomOnBoot', '        updateSecurityPatch(File(root, SECURITY_PATCH_FILE))\n        updateAppConfigs(File(root, APP_CONFIG_FILE))\n        PolicyState.initialize(root).getOrThrow()\n        refreshPrivacySeed().getOrThrow()\n\n        updateRandomOnBoot')
          replace(config, '        ConfigObserver.startWatching()\n        KeyboxDirObserver.startWatching()\n        keyboxPoller?.stop()\n        keyboxPoller =\n            FilePoller(File(root, KEYBOX_FILE), 30_000) {\n                Logger.i("Detected keybox change via polling")\n                updateKeyBoxes()\n            }\n        keyboxPoller?.start()\n', '        ConfigObserver.startWatching()\n        KeyboxDirObserver.startWatching()\n')
          replace(config, '    private var keyboxPoller: FilePoller? = null\n\n', '')
          replace(config, '            // Update poller for legacy file consistency\n            keyboxPoller?.updateLastModified()\n', '')
          replace(config, '        appState.identityCache.remove(uid)\n        targetState.hackCache.remove(uid)', '        appState.identityCache.remove(uid)\n        PolicyState.invalidateUid(uid)\n        targetState.hackCache.remove(uid)')
          replace(config, '    fun setRootForTesting(newRoot: File) {\n        privacySeed?.fill(0)\n        privacySeed = null\n        root = newRoot\n    }\n', '    fun setRootForTesting(newRoot: File) {\n        privacySeed?.fill(0)\n        privacySeed = null\n        root = newRoot\n        PolicyState.setRootForTesting(newRoot)\n    }\n')

