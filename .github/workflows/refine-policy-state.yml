name: Refine policy state

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          policy = Path('service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt')
          text = policy.read_text()
          replacements = [
              ('        val matchedPackage: String?,\n', '        val matchedRule: String?,\n'),
              ('    private val packagePattern = Regex("[A-Za-z0-9_.*]{1,255}")\n', '    private val packagePattern = Regex("(?:[A-Za-z_][A-Za-z0-9_]*|\\*)(?:\\.(?:[A-Za-z_][A-Za-z0-9_]*|\\*))*")\n'),
              ('        val matches = ArrayList<Pair<String, Profile>>()\n        normalizedPackages.forEach { packageName ->\n            val assignment = snapshotValue.assignments.firstOrNull { wildcardMatches(it.pattern, packageName) }\n            val profile = assignment?.let { findProfile(snapshotValue.profiles, it.profileName) }\n            if (profile != null) matches += packageName to profile\n        }\n        if (matches.isEmpty()) return SelectedProfile(activeProfile(snapshotValue), null, false)\n        val selected = matches.first()\n        val conflict = matches.asSequence().map { it.second.name.lowercase(Locale.ROOT) }.distinct().take(2).count() > 1\n        return SelectedProfile(selected.second, selected.first, conflict)\n', '        val matches = ArrayList<Pair<Assignment, Profile>>()\n        normalizedPackages.forEach { packageName ->\n            val assignment = snapshotValue.assignments.firstOrNull { wildcardMatches(it.pattern, packageName) }\n            val profile = assignment?.let { findProfile(snapshotValue.profiles, it.profileName) }\n            if (assignment != null && profile != null) matches += assignment to profile\n        }\n        if (matches.isEmpty()) return SelectedProfile(activeProfile(snapshotValue), null, false)\n        val selected = matches.first()\n        val conflict = matches.asSequence().map { it.second.name.lowercase(Locale.ROOT) }.distinct().take(2).count() > 1\n        return SelectedProfile(selected.second, selected.first.pattern, conflict)\n'),
              ('    fun hasTelephonyProfileWork(): Boolean {\n        val current = snapshot\n        if (current.features.telephonyIdentity) return true\n        return current.profiles.values.any { profile ->\n            profile.featureOverrides[Feature.TELEPHONY_IDENTITY] == true || profile.privacy != Config.AppPrivacyMode.INHERIT\n        }\n    }\n\n    fun hasDrmProfileWork(): Boolean = snapshot.profiles.values.any { it.privacy == Config.AppPrivacyMode.ISOLATE }\n', '    private fun hasRuntimeScope(profile: Profile, current: Snapshot): Boolean =\n        profile.applications.isNotEmpty() || current.activeProfile?.equals(profile.name, ignoreCase = true) == true\n\n    fun hasTelephonyProfileWork(): Boolean {\n        val current = snapshot\n        if (current.features.telephonyIdentity) return true\n        return current.profiles.values.any { profile ->\n            hasRuntimeScope(profile, current) &&\n                (profile.featureOverrides[Feature.TELEPHONY_IDENTITY] == true ||\n                    profile.privacy != Config.AppPrivacyMode.INHERIT)\n        }\n    }\n\n    fun hasDrmProfileWork(): Boolean {\n        val current = snapshot\n        return current.profiles.values.any { profile ->\n            hasRuntimeScope(profile, current) && profile.privacy == Config.AppPrivacyMode.ISOLATE\n        }\n    }\n'),
              ('.put("matchedApplicationRule", selected.matchedPackage ?: legacyRule?.let { packageName } ?: JSONObject.NULL)\n', '.put("matchedApplicationRule", selected.matchedRule ?: legacyRule?.let { packageName } ?: JSONObject.NULL)\n'),
              ('.put("scope", if (selected.matchedPackage != null || legacyRule != null) "targeted" else if (Config.isGlobalMode) "global" else "unmatched")\n', '.put("scope", if (selected.matchedRule != null || legacyRule != null) "targeted" else if (Config.isGlobalMode) "global" else "unmatched")\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'PolicyState mismatch: {old[:100]!r} count={text.count(old)}')
              text = text.replace(old, new, 1)
          policy.write_text(text)

          test = Path('service/src/test/java/cleveres/tricky/cleverestech/PolicyStateTest.kt')
          text = test.read_text()
          text = text.replace('import java.util.concurrent.ConcurrentHashMap\n', '')
          old = '''    private fun cachePackages(
        uid: Int,
        packages: Array<String>,
    ) {
        val cachedPackageClass = Class.forName("cleveres.tricky.cleverestech.Config\\$CachedPackage")
        val constructor =
            cachedPackageClass.getDeclaredConstructor(Array<String>::class.java, Long::class.javaPrimitiveType)
        constructor.isAccessible = true
        val cached = constructor.newInstance(packages, System.currentTimeMillis())
        val field = Config::class.java.getDeclaredField("packageCache")
        field.isAccessible = true
        @Suppress("UNCHECKED_CAST")
        val cache = field.get(Config) as ConcurrentHashMap<Int, Any>
        cache[uid] = cached
    }
'''
          new = '''    private fun cachePackages(
        uid: Int,
        packages: Array<String>,
    ) {
        Config.setPackagesForTesting(uid, packages)
    }
'''
          if text.count(old) != 1:
              raise SystemExit('PolicyStateTest cache helper mismatch')
          test.write_text(text.replace(old, new, 1))

          config = Path('service/src/main/java/cleveres/tricky/cleverestech/Config.kt')
          text = config.read_text()
          anchor = '    fun parsePackages(lines: Sequence<String>): PackageTrie<Boolean> = parsePackages(lines, Int.MAX_VALUE)\n'
          helper = '''    @androidx.annotation.VisibleForTesting
    internal fun setPackagesForTesting(
        uid: Int,
        packages: Array<String>,
    ) {
        putBoundedUidCache(packageCache, uid, CachedPackage(packages.clone(), System.currentTimeMillis()))
        PolicyState.invalidateUid(uid)
    }

'''
          if text.count(anchor) != 1:
              raise SystemExit('Config test helper anchor mismatch')
          config.write_text(text.replace(anchor, helper + anchor, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt service/src/main/java/cleveres/tricky/cleverestech/Config.kt service/src/test/java/cleveres/tricky/cleverestech/PolicyStateTest.kt
          git commit -m "fix: tighten policy resolution"
          git push origin HEAD:granular-policy-state-v2
