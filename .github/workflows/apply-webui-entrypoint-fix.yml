name: Apply WebUI entrypoint fix

on:
  push:
    branches:
      - granular-policy-state-v2
    paths:
      - .github/workflows/apply-webui-entrypoint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: granular-policy-state-v2
      - run: python .tmp/fix_policy_entrypoint.py
      - run: rm .tmp/fix_policy_entrypoint.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add module/template/webroot/index.html .tmp/fix_policy_entrypoint.py
          git commit -m "fix: load policy WebUI once"
          git push origin HEAD:granular-policy-state-v2
