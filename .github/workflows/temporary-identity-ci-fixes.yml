name: Temporary Identity CI Fixes

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  patch-identity-regressions:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/identity-profile-cron-logs' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = False

          def lines(*values: str) -> str:
              return "\n".join(values) + "\n"

          def replace_once(path: str, old: str, new: str) -> None:
              global changed
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one old hunk in {path}, found {count}")
              file.write_text(text.replace(old, new, 1))
              changed = True

          replace_once(
              'service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt',
              lines(
                  '        val thresholdMonths = 6L',
                  '        val automatic = PatchPolicy(PatchMode.AUTOMATIC)',
                  '        runCatching { Files.deleteIfExists(File(root, CronAutoIdentity.TOGGLE_FILE).toPath()) }',
              ),
              lines(
                  '        val thresholdMonths = 6L',
                  '        val automatic = PatchPolicy(PatchMode.AUTOMATIC)',
                  '        val securityPatchRecommended =',
                  '            readPropertyDate("system")?.isBefore(currentDateSource().minusMonths(thresholdMonths)) == true',
                  '        runCatching { Files.deleteIfExists(File(root, CronAutoIdentity.TOGGLE_FILE).toPath()) }',
              ),
          )
          replace_once(
              'service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt',
              '                features = FeatureSet(false, false, false, false, false, false),\n',
              '                features = FeatureSet(false, false, false, false, false, securityPatchRecommended),\n',
          )

          replace_once(
              'service/src/test/java/cleveres/tricky/cleverestech/IdentityRuntimeApplierTest.kt',
              lines(
                  '        File(root, "spoof_build_vars").writeText(',
                  '            "FINGERPRINT=google/test/device:16/TEST/1:user/release-keys\\n",',
                  '        )',
              ),
              lines(
                  '        File(root, "spoof_build_vars").writeText(',
                  '            "FINGERPRINT=google/test/device:16/TEST/1:user/release-keys\\n",',
                  '        )',
                  '        Config.updateBuildVars(File(root, "spoof_build_vars")).getOrThrow()',
              ),
          )

          replace_once(
              'service/src/androidTest/java/cleveres/tricky/cleverestech/WebUiFeatureMatrixInstrumentationTest.kt',
              lines(
                  '        val auto = request("POST", "/api/auto_identity")',
                  '        assertEquals(200, auto.status)',
                  '        val autoJson = JSONObject(auto.text)',
                  '        assertEquals("Pixel API37", autoJson.getString("model"))',
                  '        assertEquals("google/api37/api37:17/CT37/1234567:user/release-keys", autoJson.getString("fingerprint"))',
                  '        assertTrue(File(root, "spoof_build_identity").isFile)',
                  '        assertEquals("Pixel API37", readBuildVar("MODEL"))',
                  '        assertEquals("google/api37/api37:17/CT37/1234567:user/release-keys", readBuildVar("FINGERPRINT"))',
              ),
              lines(
                  '        val buildIdentityMarker = File(root, "spoof_build_identity")',
                  '        val buildIdentityBefore =',
                  '            JSONObject(request("GET", "/api/policy_state").text)',
                  '                .getJSONObject("features")',
                  '                .getBoolean("buildIdentity")',
                  '        assertFalse(buildIdentityBefore)',
                  '        assertFalse(buildIdentityMarker.exists())',
                  '',
                  '        val auto = request("POST", "/api/auto_identity")',
                  '        assertEquals(200, auto.status)',
                  '        val autoJson = JSONObject(auto.text)',
                  '        assertEquals("Pixel API37", autoJson.getString("model"))',
                  '        assertEquals("google/api37/api37:17/CT37/1234567:user/release-keys", autoJson.getString("fingerprint"))',
                  '        assertFalse("manual Auto Identity must not enable Build Identity", buildIdentityMarker.exists())',
                  '        val buildIdentityAfter =',
                  '            JSONObject(request("GET", "/api/policy_state").text)',
                  '                .getJSONObject("features")',
                  '                .getBoolean("buildIdentity")',
                  '        assertEquals(buildIdentityBefore, buildIdentityAfter)',
                  '        assertEquals("Pixel API37", readBuildVar("MODEL"))',
                  '        assertEquals("google/api37/api37:17/CT37/1234567:user/release-keys", readBuildVar("FINGERPRINT"))',
              ),
          )

          if not changed:
              print('All exact regression fixes are already present.')
          PY

          git diff --check
          node module/webui-tests/identity-policy-authority.test.js

      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt \
            service/src/test/java/cleveres/tricky/cleverestech/IdentityRuntimeApplierTest.kt \
            service/src/androidTest/java/cleveres/tricky/cleverestech/WebUiFeatureMatrixInstrumentationTest.kt
          git commit -m "fix(identity): close CI regression gaps"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
