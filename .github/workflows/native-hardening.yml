name: Native Hardening

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - "module/**"
      - "service/**"
      - "stub/**"
      - "encryptor-app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/native-hardening.yml"
  workflow_dispatch:

concurrency:
  group: native-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hardening:
    name: "🛡️ Native ELF Hardening"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Build release artifacts
        run: ./gradlew zipRelease :encryptor-app:assembleRelease --warning-mode=fail --console=plain

      - name: Verify all native ELF hardening
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            file=$1
            shift
            echo "::error file=$file::$*"
            exit 1
          }

          verify_elf() {
            binary=$1
            test -s "$binary" || fail "$binary" "Native artifact is missing or empty"
            elf_header=$(readelf -W -h "$binary")
            program_headers=$(readelf -W -l "$binary")
            dynamic_section=$(readelf -W -d "$binary")
            grep -E 'Type:[[:space:]]+DYN' <<<"$elf_header" >/dev/null || \
              fail "$binary" "ELF is not position independent (ET_DYN)"
            grep -F 'GNU_RELRO' <<<"$program_headers" >/dev/null || \
              fail "$binary" "GNU_RELRO segment is missing"
            grep -F 'BIND_NOW' <<<"$dynamic_section" >/dev/null || \
              fail "$binary" "Immediate binding (BIND_NOW) is missing"
            if ! awk '
              $1 == "GNU_STACK" { found = 1; if ($0 ~ /RWE/) exit 2 }
              END { if (!found) exit 1 }
            ' <<<"$program_headers"; then
              fail "$binary" "GNU_STACK is missing or executable"
            fi
          }

          module_root=module/build/outputs/module/release/lib
          for abi in arm64-v8a x86_64; do
            injector="$module_root/$abi/inject"
            webui_bridge="$module_root/$abi/webui_bridge"
            library="$module_root/$abi/libcleverestricky.so"
            daemon="$module_root/$abi/cleverestrickyd"
            backend="$module_root/$abi/cleverestricky_backend"

            for binary in "$injector" "$webui_bridge" "$library" "$daemon" "$backend"; do
              verify_elf "$binary"
            done

            for executable in "$injector" "$webui_bridge" "$daemon" "$backend"; do
              executable_headers=$(readelf -W -l "$executable")
              grep -F '/system/bin/linker64' <<<"$executable_headers" >/dev/null || \
                fail "$executable" "Unexpected Android program interpreter"
            done

            dyn_symbols=$(readelf -W --dyn-syms "$library")
            exports=$(awk '$5 == "GLOBAL" && $7 != "UND" && $8 != "" { print $8 }' \
              <<<"$dyn_symbols" | sort -u)
            expected_exports=$(printf 'entry\nresume')
            if [ "$exports" != "$expected_exports" ]; then
              actual=$(printf '%s\n' "$exports" | paste -sd ',' -)
              fail "$library" "Unexpected exported symbols: ${actual:-<none>} (expected: entry,resume)"
            fi
          done

          apk=encryptor-app/build/outputs/apk/release/encryptor-app-release.apk
          test -s "$apk" || fail "$apk" "Release companion APK is missing or empty"
          apk_dir=$(mktemp -d)
          trap 'rm -rf "$apk_dir"' EXIT
          unzip -q "$apk" 'lib/*/libcleveres_encryptor_crypto.so' -d "$apk_dir"
          expected_jni_exports=$(printf '%s\n' \
            Java_cleveres_tricky_encryptor_NativeCrypto_deleteEncrypted \
            Java_cleveres_tricky_encryptor_NativeCrypto_encryptAndSave \
            Java_cleveres_tricky_encryptor_NativeCrypto_ensureVault \
            Java_cleveres_tricky_encryptor_NativeCrypto_readEncrypted \
            Java_cleveres_tricky_encryptor_NativeCrypto_storeEncrypted \
            Java_cleveres_tricky_encryptor_NativeCrypto_validateKeyboxXml | sort -u)
          for abi in arm64-v8a x86_64; do
            library="$apk_dir/lib/$abi/libcleveres_encryptor_crypto.so"
            verify_elf "$library"
            dyn_symbols=$(readelf -W --dyn-syms "$library")
            exports=$(awk '$5 == "GLOBAL" && $7 != "UND" && $8 != "" { print $8 }' \
              <<<"$dyn_symbols" | sort -u)
            if [ "$exports" != "$expected_jni_exports" ]; then
              actual=$(printf '%s\n' "$exports" | paste -sd ',' -)
              expected=$(printf '%s\n' "$expected_jni_exports" | paste -sd ',' -)
              fail "$library" "Unexpected JNI exports: ${actual:-<none>} (expected: $expected)"
            fi
          done
