name: Rust Lockfile Check

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - "rust/**"
      - ".github/workflows/rust-lockfile.yml"
  workflow_dispatch:

concurrency:
  group: rust-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lockfile:
    name: "🔒 Rust Lockfile"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify committed lockfile is current
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
