name: Apply Profile Fix

on:
  push:
    branches:
      - agent/restore-working-injector

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/restore-working-injector
          fetch-depth: 0

      - name: Apply synchronous profile and clean-test fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          web = Path('service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt')
          text = web.read_text(encoding='utf-8')
          old = '''        if (uri == "/api/apply_profile" && method == Method.POST) {
               val map = HashMap<String, String>()
               try { session.parseBody(map) } catch(e:Exception){}
               val profileName = getParam(session, "profile")
               if (profileName != null) {
                   synchronized(fileLock) {
                       try {
                           SecureFile.writeText(File(configDir, "apply_profile"), profileName)
                           return secureResponse(Response.Status.OK, "text/plain", "Profile Applied")
                       } catch (e: Exception) {
                           Logger.e("Failed to apply profile via file", e)
                           return secureResponse(Response.Status.INTERNAL_ERROR, "text/plain", "Failed")
                       }
                   }
               }
               return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Missing profile")
          }
'''
          new = '''        if (uri == "/api/apply_profile" && method == Method.POST) {
              val map = HashMap<String, String>()
              try {
                  session.parseBody(map)
              } catch (e: Exception) {
                  return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Invalid request")
              }

              val profileName = getParam(session, "profile")?.trim()
              if (profileName.isNullOrEmpty()) {
                  return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Missing profile")
              }

              val supportedProfiles = setOf("godprofile", "dailyuse", "minimal", "default")
              if (profileName.lowercase() !in supportedProfiles) {
                  return secureResponse(Response.Status.BAD_REQUEST, "text/plain", "Unknown profile")
              }

              synchronized(fileLock) {
                  return try {
                      Config.applyProfile(profileName)
                      secureResponse(Response.Status.OK, "text/plain", "Profile Applied")
                  } catch (e: Exception) {
                      Logger.e("Failed to apply profile", e)
                      secureResponse(Response.Status.INTERNAL_ERROR, "text/plain", "Failed")
                  }
              }
          }
'''
          if old not in text:
              raise SystemExit('WebServer profile endpoint did not match expected source')
          web.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/build.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''      - name: Run Module Tests
              run: ./gradlew :module:testDebugUnitTest

            - name: Run Unit Tests
              run: ./gradlew testDebugUnitTest
'''
          new = '''      - name: Run Module Tests
              run: ./gradlew clean :module:testDebugUnitTest --no-build-cache

            - name: Run Unit Tests
              run: ./gradlew testDebugUnitTest --no-build-cache
'''
          if old not in text:
              raise SystemExit('Build workflow test steps did not match expected source')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/diagnose-rkp.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-profile-fix.yml').unlink(missing_ok=True)
          PY

          git diff --check
          git status --short

      - name: Commit fixes and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply profiles synchronously and isolate tests"
          git push origin HEAD:agent/restore-working-injector
