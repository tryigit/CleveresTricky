name: Attestation state hotfix staging

on:
  push:
    branches:
      - fix/v2.5.7-attestation-state-defaults

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21

      - name: Apply hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}: {old[:100]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          policy = 'service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt'
          replace_once(policy,
          '''            val parsed = parseStateFile(main, "configured")
              publish(parsed, persistPrevious = false)
          ''',
          '''            val parsed = adaptRecommendedDefault(parseStateFile(main, "configured"))
              publish(parsed, persistPrevious = false)
          ''')

          replace_once(policy,
          '''    @Synchronized
              fun applyRecommendedDefaults() {
                  val automatic = PatchPolicy(PatchMode.AUTOMATIC)
                  persistAndPublish(
                      Snapshot(
                          explicit = true,
                          features = FeatureSet(false, false, false, false, false, true),
                          patch = PatchSet(6, automatic, automatic, automatic),
                          profiles = emptyMap(),
                          activeProfile = null,
                          assignments = emptyList(),
                          generation = generationCounter.incrementAndGet(),
                          recovery = "default",
                      ),
                  )
              }
          ''',
          '''    private fun recommendedSecurityPatchEnabled(thresholdMonths: Long = 6): Boolean {
                  val now = currentDateSource()
                  val available = listOf("system", "vendor", "boot").mapNotNull(::readPropertyDate)
                  return available.any { it.isBefore(now.minusMonths(thresholdMonths)) }
              }

              private fun isRecommendedDefaultShape(value: Snapshot): Boolean {
                  val features = value.features
                  val patch = value.patch
                  return value.profiles.isEmpty() && value.activeProfile == null &&
                      !features.buildIdentity && !features.attestationIdentity && !features.telephonyIdentity &&
                      !features.regionIdentity && !features.identityRefresh &&
                      patch.thresholdMonths == 6L &&
                      patch.system.mode == PatchMode.AUTOMATIC &&
                      patch.vendor.mode == PatchMode.AUTOMATIC &&
                      patch.boot.mode == PatchMode.AUTOMATIC
              }

              private fun adaptRecommendedDefault(value: Snapshot): Snapshot {
                  if (!isRecommendedDefaultShape(value)) return value
                  val enabled = recommendedSecurityPatchEnabled(value.patch.thresholdMonths)
                  if (value.features.securityPatch == enabled) return value
                  return value.copy(
                      features = value.features.copy(securityPatch = enabled),
                      generation = generationCounter.incrementAndGet(),
                      recovery = "default_adapted",
                  )
              }

              @Synchronized
              fun applyRecommendedDefaults() {
                  val automatic = PatchPolicy(PatchMode.AUTOMATIC)
                  val enabled = recommendedSecurityPatchEnabled(6)
                  persistAndPublish(
                      Snapshot(
                          explicit = true,
                          features = FeatureSet(false, false, false, false, false, enabled),
                          patch = PatchSet(6, automatic, automatic, automatic),
                          profiles = emptyMap(),
                          activeProfile = null,
                          assignments = emptyList(),
                          generation = generationCounter.incrementAndGet(),
                          recovery = "default",
                      ),
                  )
              }
          ''')

          cert = 'service/src/main/java/cleveres/tricky/cleverestech/keystore/CertHack.java'
          replace_once(cert,
          '''        final Map<KeyBox, PreparedKeyBox> preparedKeyboxes;
                  final Map<CacheKey, Certificate[]> certificateCache;

                  State(Map<String, List<KeyBox>> keyboxes, Map<String, List<KeyBox>> keyboxFiles) {
                      this.keyboxes = immutableLists(keyboxes);
                      this.keyboxFiles = immutableLists(keyboxFiles);
                      IdentityHashMap<KeyBox, PreparedKeyBox> prepared = new IdentityHashMap<>();
                      for (List<KeyBox> list : this.keyboxes.values()) {
                          for (KeyBox keybox : list) {
                              if (prepared.containsKey(keybox)) continue;
                              try {
                                  prepared.put(keybox, new PreparedKeyBox(keybox));
                              } catch (Exception error) {
                                  Logger.e("Could not prepare keybox metadata", error);
                              }
                          }
                      }
                      this.preparedKeyboxes = Collections.unmodifiableMap(prepared);
                      this.certificateCache = Collections.synchronizedMap(
          ''',
          '''        final Map<KeyBox, PreparedKeyBox> preparedKeyboxes;
                  final byte[] bootKey;
                  final byte[] bootHash;
                  final Map<CacheKey, Certificate[]> certificateCache;

                  State(Map<String, List<KeyBox>> keyboxes, Map<String, List<KeyBox>> keyboxFiles) {
                      IdentityHashMap<KeyBox, PreparedKeyBox> prepared = new IdentityHashMap<>();
                      Map<String, List<KeyBox>> readyByAlgorithm = new HashMap<>();
                      Map<String, List<KeyBox>> readyByFile = new HashMap<>();
                      for (Map.Entry<String, List<KeyBox>> entry : keyboxes.entrySet()) {
                          for (KeyBox keybox : entry.getValue()) {
                              if (prepared.containsKey(keybox)) continue;
                              try {
                                  prepared.put(keybox, new PreparedKeyBox(keybox));
                                  readyByAlgorithm.computeIfAbsent(entry.getKey(), ignored -> new ArrayList<>()).add(keybox);
                                  readyByFile.computeIfAbsent(keybox.filename, ignored -> new ArrayList<>()).add(keybox);
                              } catch (Exception error) {
                                  Logger.e("Ignoring an unprepared keybox", error);
                              }
                          }
                      }
                      this.keyboxes = immutableLists(readyByAlgorithm);
                      this.keyboxFiles = immutableLists(readyByFile);
                      this.preparedKeyboxes = Collections.unmodifiableMap(prepared);
                      if (prepared.isEmpty()) {
                          this.bootKey = null;
                          this.bootHash = null;
                      } else {
                          byte[] resolvedBootKey = usableBootDigest(UtilKt.getBootKey());
                          byte[] resolvedBootHash = usableBootDigest(UtilKt.getBootHash());
                          if (resolvedBootKey == null) resolvedBootKey = usableBootDigest(UtilKt.getPersistentBootKey());
                          if (resolvedBootHash == null) resolvedBootHash = usableBootDigest(UtilKt.getPersistentBootHash());
                          this.bootKey = resolvedBootKey == null ? null : resolvedBootKey.clone();
                          this.bootHash = resolvedBootHash == null ? null : resolvedBootHash.clone();
                      }
                      this.certificateCache = Collections.synchronizedMap(
          ''')

          replace_once(cert,
          '''    public static boolean canHack() {
                  return !state.keyboxes.isEmpty();
              }
          ''',
          '''    public static boolean canHack() {
                  State currentState = state;
                  return !currentState.keyboxes.isEmpty() && currentState.bootKey != null && currentState.bootHash != null;
              }
          ''')

          replace_once(cert,
          '''            byte[] verifiedBootKey = usableBootDigest(UtilKt.getBootKey());
                      byte[] verifiedBootHash = usableBootDigest(UtilKt.getBootHash());
          ''',
          '''            byte[] verifiedBootKey = currentState.bootKey == null ? null : currentState.bootKey.clone();
                      byte[] verifiedBootHash = currentState.bootHash == null ? null : currentState.bootHash.clone();
          ''')

          replace_once(cert,
          '''            ASN1Encodable[] rootOfTrustEnc = {
                          new DEROctetString(verifiedBootKey),
                          ASN1Boolean.TRUE,
                          new ASN1Enumerated(0),
                          new DEROctetString(verifiedBootHash)
                  };

                  ASN1Sequence hackedRootOfTrust = new DERSequence(rootOfTrustEnc);
          ''',
          '''            ASN1Sequence hackedRootOfTrust = buildLockedRootOfTrust(verifiedBootKey, verifiedBootHash);
          ''')

          marker = '''    private static byte[] usableBootDigest(byte[] value) {
          '''
          helper = '''    static ASN1Sequence buildLockedRootOfTrust(byte[] verifiedBootKey, byte[] verifiedBootHash) {
                  Objects.requireNonNull(verifiedBootKey, "verifiedBootKey");
                  Objects.requireNonNull(verifiedBootHash, "verifiedBootHash");
                  ASN1Encodable[] rootOfTrustEnc = {
                          new DEROctetString(verifiedBootKey),
                          ASN1Boolean.TRUE,
                          new ASN1Enumerated(0),
                          new DEROctetString(verifiedBootHash)
                  };
                  return new DERSequence(rootOfTrustEnc);
              }

          ''' + marker
          replace_once(cert, marker, helper)

          template = Path('module/template/policy_state_v2.json')
          text = template.read_text()
          text = text.replace('"securityPatch": true', '"securityPatch": false', 1)
          template.write_text(text)

          test = Path('service/src/test/java/cleveres/tricky/cleverestech/PolicyStateHotPathTest.kt')
          text = test.read_text()
          text = text.replace('''            PolicyState.setRootForTesting(root)
                      PolicyState.applyRecommendedDefaults()
          ''', '''            PolicyState.setRootForTesting(root)
                      val oldProperties = systemPropertiesGet
                      systemPropertiesGet = { key, default ->
                          when (key) {
                              "ro.build.version.security_patch",
                              "ro.vendor.build.security_patch",
                              "ro.bootimage.build.version.security_patch" -> "2026-08-05"
                              else -> default
                          }
                      }
                      PolicyState.currentDateSource = { LocalDate.of(2026, 8, 14) }
                      PolicyState.applyRecommendedDefaults()
          ''', 1)
          text = text.replace('''            assertTrue(features.getBoolean("securityPatch"))
          ''', '''            assertFalse(features.getBoolean("securityPatch"))
          ''', 1)
          text = text.replace('''        } finally {
                      PolicyState.resetForTesting()
                      root.deleteRecursively()
                  }
              }

              @Test
              fun capturedAutomaticPatchSkipsPropertyReads() {
          ''', '''        } finally {
                      systemPropertiesGet = { key, default -> android.os.SystemProperties.get(key, default) }
                      PolicyState.resetForTesting()
                      root.deleteRecursively()
                  }
              }

              @Test
              fun staleDeviceEnablesAutomaticSecurityPatchByDefault() {
                  val root = Files.createTempDirectory("ct-defaults-stale").toFile()
                  val oldProperties = systemPropertiesGet
                  try {
                      PolicyState.setRootForTesting(root)
                      systemPropertiesGet = { key, default ->
                          when (key) {
                              "ro.build.version.security_patch" -> "2025-01-05"
                              "ro.vendor.build.security_patch",
                              "ro.bootimage.build.version.security_patch" -> "2026-08-05"
                              else -> default
                          }
                      }
                      PolicyState.currentDateSource = { LocalDate.of(2026, 8, 14) }
                      PolicyState.applyRecommendedDefaults()
                      assertTrue(PolicyState.stateJson().getJSONObject("features").getBoolean("securityPatch"))
                  } finally {
                      systemPropertiesGet = oldProperties
                      PolicyState.resetForTesting()
                      root.deleteRecursively()
                  }
              }

              @Test
              fun capturedAutomaticPatchSkipsPropertyReads() {
          ''', 1)
          test.write_text(text)

          certtest = Path('service/src/test/java/cleveres/tricky/cleverestech/keystore/CertHackTest.java')
          text = certtest.read_text()
          text = text.replace('''import org.junit.After;
          import org.junit.Test;
          ''', '''import org.bouncycastle.asn1.ASN1Boolean;
          import org.bouncycastle.asn1.ASN1Enumerated;
          import org.bouncycastle.asn1.ASN1OctetString;
          import org.bouncycastle.asn1.ASN1Sequence;
          import org.junit.After;
          import org.junit.Test;
          ''', 1)
          insert = '''
              @Test
              public void testLockedRootOfTrustIsStable() {
                  byte[] key = new byte[32];
                  byte[] hash = new byte[32];
                  key[0] = 1;
                  hash[0] = 2;
                  ASN1Sequence root = CertHack.buildLockedRootOfTrust(key, hash);
                  assertArrayEquals(key, ASN1OctetString.getInstance(root.getObjectAt(0)).getOctets());
                  assertTrue(ASN1Boolean.getInstance(root.getObjectAt(1)).isTrue());
                  assertEquals(0, ASN1Enumerated.getInstance(root.getObjectAt(2)).getValue().intValue());
                  assertArrayEquals(hash, ASN1OctetString.getInstance(root.getObjectAt(3)).getOctets());
              }
          '''
          text = text.replace('\n    @Test\n    public void testSigningKeyAlgorithmUsesCertificateSigner()', insert + '\n    @Test\n    public void testSigningKeyAlgorithmUsesCertificateSigner()', 1)
          certtest.write_text(text)

          Path('.github/workflows/attestation-state-hotfix.yml').unlink()
          PY

      - name: Validate focused changes
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :service:testDebugUnitTest --no-daemon
          for test in module/webui-tests/*.test.js; do node "$test"; done
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yiğit"
          git config user.email "40565628+tryigit@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: stabilize attestation state and adaptive defaults"
          git push origin HEAD
