name: Apply policy route security fix

on:
  push:
    branches:
      - granular-policy-state-v2
    paths:
      - .github/workflows/apply-policy-route-security.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: granular-policy-state-v2
      - run: python .tmp/fix_policy_route_security.py
      - run: rm .tmp/fix_policy_route_security.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add service/src/main/java/cleveres/tricky/cleverestech service/src/test/java/cleveres/tricky/cleverestech .tmp/fix_policy_route_security.py
          git commit -m "fix: keep policy routes behind common request validation"
          git push origin HEAD:granular-policy-state-v2
