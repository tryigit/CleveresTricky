name: Deep Bug Fix Apply

on:
  push:
    branches:
      - fix/deep-bug-sweep-followup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/deep-bug-sweep-followup
          fetch-depth: 0

      - name: Apply targeted fixes
        run: python3 tools/deep_bug_fix_apply.py

      - name: Validate generated diff
        run: |
          node module/webui-tests/bridge.test.js
          git diff --check

      - name: Remove temporary patch machinery
        run: |
          rm tools/deep_bug_fix_apply.py
          rm .github/workflows/deep-bug-fix-apply.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "fix: close deep bug sweep regressions"
          git push origin HEAD:fix/deep-bug-sweep-followup
