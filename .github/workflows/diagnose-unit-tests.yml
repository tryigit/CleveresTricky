name: Diagnose Unit Tests

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Print Android stub sources
        shell: bash
        run: |
          find stub service/src/test -type f \( -name 'Parcel.java' -o -name 'Parcel.kt' -o -name 'Binder.java' -o -name 'Binder.kt' \) -print | while read -r file; do
            echo "=== SOURCE: $file ==="
            cat "$file"
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run service unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew :service:testDebugUnitTest --rerun-tasks

      - name: Print failing test XML
        if: always()
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' file; do
            if grep -Eq '<failure|<error' "$file"; then
              found=1
              echo "=== FAILED TEST XML: $file ==="
              cat "$file"
            fi
          done < <(find service/build/test-results/testDebugUnitTest -type f -name '*.xml' -print0 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo "No failing test XML found"
          fi

      - name: Propagate unit test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
