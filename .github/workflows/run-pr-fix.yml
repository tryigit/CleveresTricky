name: Run policy semantics fix

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: python3 .tmp/fix_pr_semantics.py
      - run: ./gradlew ktlintFormat --warning-mode=fail --console=plain
      - shell: bash
        run: |
          set -euo pipefail
          rm .tmp/fix_pr_semantics.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add service/src/main/java/cleveres/tricky/cleverestech/Config.kt service/src/main/java/cleveres/tricky/cleverestech/PolicyApi.kt service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt service/src/main/java/cleveres/tricky/cleverestech/DrmInterceptor.kt service/src/test/java/cleveres/tricky/cleverestech/PolicyStateTest.kt .tmp/fix_pr_semantics.py
          git commit -m "fix: preserve profile inheritance semantics"
          git push origin HEAD:granular-policy-state-v2
