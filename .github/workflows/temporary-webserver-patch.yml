name: Temporary WebServer Patch

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  patch-auto-identity-endpoint:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/identity-profile-cron-logs' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact Auto Identity endpoint patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt')
          text = path.read_text()
          old = '''                val updates = linkedMapOf<String, String?>("TEMPLATE" to null)\n                resolved.buildVars().forEach { (key, value) ->\n                    require(Config.isValidBuildVarEntry(key, value)) { "Auto Identity returned an invalid build field" }\n                    updates[key] = value\n                }\n                if (!saveIdentityUpdates(updates)) {\n                    return secureResponse(Response.Status.INTERNAL_ERROR, "text/plain", "Auto Identity could not be saved")\n                }\n                SecureFile.touch(File(configDir, "spoof_build_identity"), 384)\n                Config.refreshRuntimeSetting("spoof_build_identity")\n'''
          new = '''                AutoIdentityPersistence.save(configDir, resolved).getOrThrow()\n'''
          count = text.count(old)
          if count == 0:
              print('Endpoint is already patched; no commit needed.')
          elif count == 1:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit(f'Expected exactly one Auto Identity endpoint block, found {count}')
          PY

          if git diff --quiet -- service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt; then
            exit 0
          fi
          git diff --check
          changed=$(git diff --name-only)
          test "$changed" = "service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt"
          git diff -- service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/src/main/java/cleveres/tricky/cleverestech/WebServer.kt
          git commit -m "fix(identity): keep Auto Identity from enabling Build Identity"
          git push origin "HEAD:${{ github.head_ref }}"
