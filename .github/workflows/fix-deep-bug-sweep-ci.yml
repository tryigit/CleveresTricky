name: Fix deep bug sweep CI

on:
  push:
    branches:
      - fix/deep-bug-sweep

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Repair Config scope and clean diagnostics
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('service/src/main/java/cleveres/tricky/cleverestech/Config.kt')
          text = path.read_text()
          old = '''        }
    val cacheIterator = storedKeyboxCache.keys.iterator()
'''
          new = '''        }
    }
    val cacheIterator = storedKeyboxCache.keys.iterator()
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one Config scope match, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f ci-diagnostics.txt
          git rm --ignore-unmatch .github/workflows/fix-deep-bug-sweep-ci.yml
          git add service/src/main/java/cleveres/tricky/cleverestech/Config.kt ci-diagnostics.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: repair keybox cache scope"
          git push origin "HEAD:$HEAD_REF"
