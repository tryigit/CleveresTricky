name: Fix policy compile

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          config = Path('service/src/main/java/cleveres/tricky/cleverestech/Config.kt')
          text = config.read_text()
          old = "        KeyboxDirObserver.stopWatching()\n        keyboxPoller?.stop()\n        keyboxPoller = null\n        targetBypassPoller?.stop()\n"
          new = "        KeyboxDirObserver.stopWatching()\n        targetBypassPoller?.stop()\n"
          if text.count(old) != 1:
              raise SystemExit('Config poller reset block mismatch')
          text = text.replace(old, new, 1)
          old = "        runtimeController = null\n        runtimeControllerScheduled = false\n        targetState.runtimeController = null\n    }\n"
          new = "        runtimeController = null\n        runtimeControllerScheduled = false\n        targetState.runtimeController = null\n        PolicyState.resetForTesting()\n    }\n"
          if text.count(old) != 1:
              raise SystemExit('Config reset tail mismatch')
          config.write_text(text.replace(old, new, 1))
          policy = Path('service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt')
          text = policy.read_text()
          if text.count('    internal data class Snapshot(\n') != 1 or text.count('    internal fun parseStateJson(\n') != 1:
              raise SystemExit('Policy visibility block mismatch')
          text = text.replace('    internal data class Snapshot(\n', '    private data class Snapshot(\n', 1)
          text = text.replace('    internal fun parseStateJson(\n', '    private fun parseStateJson(\n', 1)
          old = "        val sourceDate =\n            when {\n                component == \"system\" && propertyDate != null -> propertyDate\n                capturedDate != null -> capturedDate\n                else -> propertyDate\n            } ?: return Config.AttestationPatchComponent(Config.PatchDisposition.KEEP)\n"
          new = "        val sourceDate = capturedDate ?: propertyDate\n            ?: return Config.AttestationPatchComponent(Config.PatchDisposition.KEEP)\n"
          if text.count(old) != 1:
              raise SystemExit('Automatic patch source block mismatch')
          text = text.replace(old, new, 1)
          old = "        return runCatching { file.readText().trim().lowercase(Locale.ROOT).takeIf { it in allowed } ?: fallback }.getOrDefault(fallback)\n"
          new = "        return runCatching {\n            Files.newInputStream(file.toPath(), LinkOption.NOFOLLOW_LINKS).bufferedReader(Charsets.UTF_8).use { reader ->\n                reader.readText().trim().lowercase(Locale.ROOT).takeIf { it in allowed } ?: fallback\n            }\n        }.getOrDefault(fallback)\n"
          if text.count(old) != 1:
              raise SystemExit('Small setting reader mismatch')
          text = text.replace(old, new, 1)
          anchor = "    @androidx.annotation.VisibleForTesting\n    internal fun setRootForTesting(directory: File) {\n"
          helper = "    @androidx.annotation.VisibleForTesting\n    internal fun installStateForTesting(text: String) {\n        snapshot = parseStateJson(text, recovery = \"test\", validateReferences = false)\n        initialized = true\n        invalidateResolutionCaches()\n    }\n\n"
          if text.count(anchor) != 1:
              raise SystemExit('Testing helper anchor mismatch')
          policy.write_text(text.replace(anchor, helper + anchor, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add service/src/main/java/cleveres/tricky/cleverestech/Config.kt service/src/main/java/cleveres/tricky/cleverestech/PolicyState.kt
          git commit -m "fix: harden policy state compilation"
          git push origin HEAD:granular-policy-state-v2
