name: Fix CodeRabbit PR 1245

on:
  push:
    branches:
      - fix/webui-adapter-registration-starvation

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: avoid holding adapter registration mutex') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/webui-adapter-registration-starvation
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Refactor adapter relay ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('rust/daemon/src/main.rs')
          s = p.read_text()
          anchor = '    let adapter: Arc<std::sync::Mutex<Option<RegisteredAdapter>>> =\\n        Arc::new(std::sync::Mutex::new(None));\\n'
          if anchor not in s:
              raise SystemExit('adapter state anchor not found')
          if 'let relay_gate = Arc::new(std::sync::Mutex::new(()));' not in s:
              s = s.replace(anchor, anchor + '    let relay_gate = Arc::new(std::sync::Mutex::new(()));\\n', 1)
          start = s.index('                let adapter_state = Arc::clone(&adapter);', s.index('OP_WEB_REQUEST'))
          end_marker = '                if let Err(error) = spawn_result {\\n                    eprintln!("cleverestrickyd: could not spawn WebUI request worker: {error}");\\n                }\\n'
          end = s.index(end_marker, start) + len(end_marker)
          old = s[start:end]
          new = '''                let adapter_state = Arc::clone(&adapter);\n                let relay_gate = Arc::clone(&relay_gate);\n                let spawn_result = thread::Builder::new()\n                    .name("ct-web-request".to_string())\n                    .spawn(move || {\n                        let mut relay_buffer = vec![0u8; STREAM_COPY_BYTES];\n                        let _relay_guard = match relay_gate.lock() {\n                            Ok(guard) => guard,\n                            Err(_) => {\n                                let error =\n                                    io::Error::other("adapter relay gate is poisoned");\n                                let _ = reply_error(&mut client, OP_WEB_REQUEST, &error);\n                                return;\n                            }\n                        };\n\n                        let mut selected = match adapter_state.lock() {\n                            Ok(mut registered) => registered.take(),\n                            Err(_) => {\n                                let error =\n                                    io::Error::other("adapter registration state is poisoned");\n                                let _ = reply_error(&mut client, OP_WEB_REQUEST, &error);\n                                return;\n                            }\n                        };\n\n                        if selected.is_none() {\n                            let error = io::Error::other("Android adapter is unavailable");\n                            let _ = reply_error(&mut client, OP_WEB_REQUEST, &error);\n                            return;\n                        }\n\n                        let result = forward_web_request_with_timeout(\n                            &mut client,\n                            header,\n                            &mut selected,\n                            &mut relay_buffer,\n                            WEB_REQUEST_TIMEOUT,\n                        );\n\n                        match result {\n                            Ok(()) => {\n                                if let Some(adapter) = selected.take() {\n                                    if let Ok(mut registered) = adapter_state.lock() {\n                                        if registered.is_none() {\n                                            *registered = Some(adapter);\n                                        }\n                                    }\n                                }\n                            }\n                            Err(ForwardError::AdapterFailed(error)) => {\n                                let _ = reply_error(&mut client, OP_WEB_REQUEST, &error);\n                            }\n                            Err(ForwardError::AdapterUnavailable(error)) => {\n                                let _ = reply_error(&mut client, OP_WEB_REQUEST, &error);\n                            }\n                            Err(ForwardError::ClientFailed { preserve_adapter }) => {\n                                if preserve_adapter {\n                                    if let Some(adapter) = selected.take() {\n                                        if let Ok(mut registered) = adapter_state.lock() {\n                                            if registered.is_none() {\n                                                *registered = Some(adapter);\n                                            }\n                                        }\n                                    }\n                                }\n                            }\n                        }\n                    });\n                if let Err(error) = spawn_result {\n                    eprintln!("cleverestrickyd: could not spawn WebUI request worker: {error}");\n                }\n'''
          # The old block should not already contain the corrected relay gate.
          if 'let relay_gate = Arc::clone(&relay_gate);' in old:
              raise SystemExit('worker block already patched')
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
          cargo fmt --manifest-path rust/Cargo.toml --all
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/daemon/src/main.rs
          git rm .github/workflows/fix-coderabbit-1245.yml
          git commit -m "fix: avoid holding adapter registration mutex"
          git push origin HEAD:fix/webui-adapter-registration-starvation
