name: Apply deep bug sweep patch

on:
  push:
    branches: ["fix/deep-bug-sweep-20260820"]
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/deep-bug-sweep-20260820
          fetch-depth: 0

      - name: Apply fixes and regression tests
        run: python3 .github/deep_bug_patch.py

      - name: Remove temporary patch machinery
        run: rm .github/deep_bug_patch.py .github/workflows/deep-bug-sweep-patch.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close deep bug sweep findings"
          git push origin HEAD:fix/deep-bug-sweep-20260820
