name: Diagnose policy checks

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: read

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - uses: android-actions/setup-android@v4
      - run: ./gradlew ktlintCheck --console=plain --stacktrace --no-build-cache --rerun-tasks

  service-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - uses: android-actions/setup-android@v4
      - run: ./gradlew :service:lintDebug --console=plain --stacktrace --no-build-cache --rerun-tasks

  other-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - uses: android-actions/setup-android@v4
      - run: ./gradlew :stub:lintDebug :encryptor-app:lintDebug --console=plain --stacktrace --no-build-cache --rerun-tasks

  service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - uses: android-actions/setup-android@v4
      - run: ./gradlew :service:testDebugUnitTest --console=plain --stacktrace --no-build-cache --rerun-tasks

  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --check module/template/webroot/bridge.js
      - run: node --check module/template/webroot/policy.js
      - shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('module/template/webroot/index.html', 'utf8')
          const blocks = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(match => !/\bsrc\s*=/.test(match[1]))
          if (blocks.length !== 1) throw new Error('Unexpected inline script count')
          new Function(blocks[0][2])
          NODE
