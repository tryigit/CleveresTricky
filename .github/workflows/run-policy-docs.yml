name: Run policy documentation update

on:
  push:
    branches: [ "granular-policy-state-v2" ]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .tmp/update_docs.py
      - shell: bash
        run: |
          set -euo pipefail
          rm .tmp/update_docs.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs CHANGELOG.md .tmp/update_docs.py
          git commit -m "docs: describe granular policy state"
          git push origin HEAD:granular-policy-state-v2
