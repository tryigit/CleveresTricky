name: Run reported stability fixes

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-kernelsu-artifact-and-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-kernelsu-artifact-and-hardening
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Execute non-workflow patch payload
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-patch-kernelsu-artifact.yml').read_text().splitlines()
          start = next((i for i, line in enumerate(workflow) if line == '      - name: Patch reported issues'), None)
          if start is None:
              raise SystemExit('Patch step not found')
          run_line = next((i + 1 for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |'), None)
          if run_line is None:
              raise SystemExit('Patch run block not found')
          end = next((i for i in range(run_line, len(workflow)) if workflow[i] == '      - name: Run focused regressions'), None)
          if end is None:
              raise SystemExit('Patch step end not found')

          payload = []
          in_python = False
          in_triple = False
          for raw in workflow[run_line:end]:
              if in_python and in_triple:
                  line = raw
              else:
                  line = raw[10:] if raw.startswith('          ') else raw
              payload.append(line)

              if not in_python and line == "python3 <<'PY'":
                  in_python = True
                  continue
              if in_python and not in_triple and line == 'PY':
                  in_python = False
                  continue
              if in_python and line.count("'''") % 2 == 1:
                  in_triple = not in_triple

          while payload and payload[-1] == '':
              payload.pop()
          if not payload or in_triple:
              raise SystemExit('Patch payload extraction is incomplete')

          script = '\n'.join(payload) + '\n'
          build_start = script.find('# Build/release workflow:')
          webui_start = script.find('# KernelSU/APatch JS bridge compatibility.')
          if build_start < 0 or webui_start < 0 or webui_start <= build_start:
              raise SystemExit('Could not isolate non-workflow patch payload')
          script = script[:build_start] + script[webui_start:]
          script = script.replace(
              "new_key_parser = '''private fun decodeBootDigest(value: String?): ByteArray? {",
              "new_key_parser = '''@OptIn(ExperimentalStdlibApi::class)\\nprivate fun decodeBootDigest(value: String?): ByteArray? {",
          )
          Path('/tmp/reported-fixes.sh').write_text(script)
          PY
          bash /tmp/reported-fixes.sh
          python3 <<'PY'
          from pathlib import Path
          path = Path('module/webui-tests/bridge.test.js')
          text = path.read_text()
          old = "        assert.deepStrictEqual(await response.json(), { status: 'ok' });"
          new = "        assert.strictEqual(JSON.stringify(await response.json()), JSON.stringify({ status: 'ok' }));"
          if old not in text and new not in text:
              raise SystemExit('Bridge assertion anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check module/template/webroot/bridge.js
          node module/webui-tests/bridge.test.js
          ./gradlew :service:testDebugUnitTest --tests cleveres.tricky.cleverestech.UtilTest --console=plain

      - name: Commit non-workflow fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/AGENT_PR_NOTES*.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/template/webroot/bridge.js \
            module/template/webroot/index.html \
            module/webui-tests/bridge.test.js \
            service/src/main/java/cleveres/tricky/cleverestech/Util.kt \
            service/src/test/java/cleveres/tricky/cleverestech/UtilTest.kt
          git add -u .github
          git commit -m "fix: harden KernelSU WebUI and root of trust handling"
          git push origin HEAD:agent/fix-kernelsu-artifact-and-hardening
