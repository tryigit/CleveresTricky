name: One-shot Rustfmt Repair

on:
  push:
    branches:
      - fix/webui-adapter-registration-starvation

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/webui-adapter-registration-starvation
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Format daemon and commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/Cargo.toml --all
          if git diff --quiet -- rust/daemon/src/main.rs; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/daemon/src/main.rs
          git rm .github/workflows/format-fix-once.yml
          git commit -m "style: rustfmt daemon source"
          git push origin HEAD:fix/webui-adapter-registration-starvation

      - name: Re-run Build workflow on repaired branch
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref fix/webui-adapter-registration-starvation

# One-shot helper: removed after it formats the branch.