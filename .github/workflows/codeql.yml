name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Select CodeQL-supported Kotlin compiler
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          expected='kotlin = "2.4.20-RC"'
          supported='kotlin = "2.4.10"'
          if ! grep -Fxq "$expected" gradle/libs.versions.toml; then
            echo "::error::Unexpected Kotlin version; update the CodeQL compatibility pin deliberately"
            exit 1
          fi
          sed -i "s/^$expected$/$supported/" gradle/libs.versions.toml
          grep -Fx "$supported" gradle/libs.versions.toml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Java and Kotlin sources for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          ./gradlew --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx1536m -XX:MaxMetaspaceSize=512m' \
            :module:compileDebugKotlin \
            :service:compileDebugKotlin \
            :stub:compileDebugKotlin \
            :encryptor-app:compileDebugKotlin \
            --warning-mode=fail --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          category: "/language:${{ matrix.language }}"
