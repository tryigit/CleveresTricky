name: WebUI Dashboard Cleanup Once

on:
  push:
    branches:
      - fix/webui-dashboard-cleanup-20260813
    paths:
      - .github/workflows/webui-dashboard-cleanup-once.yml
      - .github/scripts/webui-dashboard-cleanup-once.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/webui-dashboard-cleanup-20260813
          fetch-depth: 0

      - name: Apply WebUI cleanup
        run: python3 .github/scripts/webui-dashboard-cleanup-once.py

      - name: Verify WebUI syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check module/template/webroot/bridge.js
          node --check module/template/webroot/ux.js
          node --check module/template/webroot/ux-base.js
          node --check module/template/webroot/policy.js
          node module/webui-tests/bridge.test.js

      - name: Commit verified WebUI cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/template/webroot/index.html
          git add module/template/webroot/bridge.js
          git add module/template/webroot/policy.js
          git add module/template/webroot/ux.js
          git add module/template/webroot/ux-base.js
          git add module/template/webroot/LOCALES.md
          git add module/webui-tests/bridge-base.test.js
          git add module/webui-tests/bridge.test.js
          git add service/src/test/java/cleveres/tricky/cleverestech/WebServerUXTest.kt
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "Fix WebUI dashboard ownership and localization regressions"
          git push origin HEAD:fix/webui-dashboard-cleanup-20260813
