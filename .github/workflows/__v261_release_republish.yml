name: V261 Release Asset Republish

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - ".github/workflows/__v261_release_republish.yml"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  republish:
    if: github.head_ref == 'hotfix/v261-release-republish'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged V2.6.1 hotfix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Build module release zip only
        run: ./gradlew zipRelease --warning-mode=fail --console=plain

      - name: Stage existing release names
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readarray -t meta < <(python3 - <<'PY'
          import json
          import os
          import urllib.parse

          with open('update.json', 'r', encoding='utf-8') as handle:
              data = json.load(handle)
          url = data['zipUrl']
          parsed = urllib.parse.urlparse(url)
          parts = parsed.path.split('/')
          try:
              index = parts.index('download')
              tag = parts[index + 1]
          except (ValueError, IndexError):
              raise SystemExit('Could not derive release tag from update.json zipUrl')
          asset = os.path.basename(parsed.path)
          print(tag)
          print(asset)
          PY
          )
          tag="${meta[0]}"
          asset="${meta[1]}"
          [ "$tag" = "V2.6.1" ] || { echo "::error::Unexpected release tag: $tag"; exit 1; }
          [ -n "$asset" ] || { echo "::error::Empty module asset name"; exit 1; }

          shopt -s nullglob
          zips=(module/release/*-release.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::Expected exactly one module release zip"; exit 1; }
          unzip -tq "${zips[0]}" >/dev/null

          rm -rf release-assets
          mkdir -p release-assets
          cp "${zips[0]}" "release-assets/$asset"
          gh release download "$tag" --pattern 'encryptor-app-release.apk' --dir release-assets
          [ -s release-assets/encryptor-app-release.apk ] || { echo "::error::Existing Encryptor APK asset is missing"; exit 1; }

          (
            cd release-assets
            sha256sum -- "$asset" encryptor-app-release.apk | LC_ALL=C sort -k2 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Attest refreshed release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Replace V2.6.1 module assets in place
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.release.outputs.tag }}" \
            "release-assets/${{ steps.release.outputs.asset }}" \
            release-assets/SHA256SUMS \
            --clobber

      - name: Verify published module checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify_dir"
          gh release download "${{ steps.release.outputs.tag }}" \
            --pattern "${{ steps.release.outputs.asset }}" \
            --pattern 'SHA256SUMS' \
            --dir "$verify_dir"
          expected=$(awk -v name="${{ steps.release.outputs.asset }}" '$2 == name {print $1}' "$verify_dir/SHA256SUMS")
          [ -n "$expected" ] || { echo "::error::Published checksum entry missing"; exit 1; }
          actual=$(sha256sum "$verify_dir/${{ steps.release.outputs.asset }}" | awk '{print $1}')
          [ "$actual" = "$expected" ] || { echo "::error::Published release asset checksum mismatch"; exit 1; }
