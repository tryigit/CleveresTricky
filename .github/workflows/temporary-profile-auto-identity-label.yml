name: Temporary Profile Auto Identity Label Patch

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

jobs:
  patch-profile-label:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/identity-profile-cron-logs' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch only the profile Identity Refresh presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('module/template/webroot/policy.js')
          text = path.read_text()
          old = '''const PROFILE_FEATURES = FEATURE_KEYS.concat([\n  ['securityPatch', 'Security Patch', 'Override the Security Patch feature only for apps assigned to this profile.']\n]);\n'''
          new = '''const PROFILE_FEATURES = FEATURE_KEYS.map((feature) =>\n  feature[0] === 'identityRefresh'\n    ? ['identityRefresh', 'Auto Identity (Pixel Beta)', 'Fetches a fresh Pixel Beta identity every 24 hours while this profile is enabled and Build Identity is effective. Assigned apps use the refreshed identity; profile-only refresh never resets device-wide Build properties.']\n    : feature\n).concat([\n  ['securityPatch', 'Security Patch', 'Override the Security Patch feature only for apps assigned to this profile.']\n]);\n'''
          count = text.count(old)
          if count == 0:
              print('Profile Auto Identity label is already patched; no commit needed.')
          elif count == 1:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit(f'Expected exactly one PROFILE_FEATURES block, found {count}')
          PY

          if git diff --quiet -- module/template/webroot/policy.js; then
            exit 0
          fi
          git diff --check
          changed=$(git diff --name-only)
          test "$changed" = "module/template/webroot/policy.js"
          git diff -- module/template/webroot/policy.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module/template/webroot/policy.js
          git commit -m "feat(webui): expose Auto Identity in Profiles"
          git push origin "HEAD:${{ github.head_ref }}"
