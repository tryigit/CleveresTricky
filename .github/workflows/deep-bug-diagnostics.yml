name: Deep bug diagnostics

on:
  pull_request:
    branches: [ "master" ]
    paths: [ ".github/workflows/deep-bug-diagnostics.yml" ]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/deep-bug-sweep
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture lint and unit-test failures
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :service:lintDebug --stacktrace > /tmp/lint.log 2>&1
          lint_status=$?
          ./gradlew :service:testDebugUnitTest --stacktrace > /tmp/test.log 2>&1
          test_status=$?
          {
            echo "lint_status=$lint_status"
            echo "test_status=$test_status"
            echo "===== LINT ERROR LINES ====="
            grep -E -n "(^|: )(Error|Warning):|\[.*Error\]|FAILURE:|Lint found|error:" /tmp/lint.log | tail -n 200 || true
            echo "===== LINT TAIL ====="
            tail -n 180 /tmp/lint.log
            echo "===== UNIT TEST FAILURE LINES ====="
            grep -E -n "FAILED|FAILURE:|AssertionError|expected:|Caused by:|> Task .* FAILED" /tmp/test.log | tail -n 250 || true
            echo "===== UNIT TEST TAIL ====="
            tail -n 220 /tmp/test.log
            echo "===== TEST XML FAILURES ====="
            find service/build/test-results -type f -name '*.xml' -print0 2>/dev/null | xargs -0 grep -H -E '<failure|<error' 2>/dev/null | head -n 250 || true
          } > ci-diagnostics.txt
          exit 0
      - name: Commit diagnostics and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/deep-bug-diagnostics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record CI failure diagnostics"
          git push origin HEAD:fix/deep-bug-sweep
