[workspace]
members = [
    "attestation-core",
    "backend",
    "cbox-recovery-core",
    "certificate-core",
    "crl-core",
    "crypto-core",
    "daemon",
    "encryptor-native",
    "injector-core",
    "keybox-core",
    "native-core",
    "policy-config-core",
    "service-core",
    "webui-bridge",
    "xml-core"
]
resolver = "2"

[workspace.dependencies]
# API-coupled storage crypto lane. Workspace members inherit these versions so
# Dependabot cannot leave one crate on an older incompatible crypto stack.
aes-gcm = { version = "=0.11.0", features = ["zeroize"] }
getrandom = "=0.4.3"
pbkdf2 = { version = "=0.13.0", features = ["sha2"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "unwind"
