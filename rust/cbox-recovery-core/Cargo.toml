[package]
name = "cleverestricky-cbox-recovery-core"
version = "0.1.0"
edition = "2021"
description = "Source-bound CBOX recovery-key derivation and decryption"
license = "GPL-3.0-only"

[dependencies]
aes-gcm = { workspace = true }
cleverestricky-crypto-core = { path = "../crypto-core" }
pbkdf2 = { workspace = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[dev-dependencies]
base64 = "=0.23.1"
