# Additional GPLv3 section 7(b) attribution term for tryigit-owned material: see ../../NOTICE.
[package]
name = "cleverestricky-certificate-core"
version = "0.1.0"
edition = "2021"
description = "Bounded X.509 attestation rewrite and signing core for CleveresTricky"
license = "GPL-3.0-only"
publish = false

[lib]
path = "src/entry.rs"

[dependencies]
attestation-der = { package = "der", version = "=0.8.1", features = ["alloc"] }
cleverestricky-attestation-core = { path = "../attestation-core" }
der = { version = "=0.7.10", features = ["alloc", "oid", "pem"] }
p256 = { version = "=0.14.0", features = ["ecdsa", "pkcs8"] }
rsa = { version = "=0.9.10", features = ["sha2"] }
sha2 = { version = "=0.11.0", features = ["oid"] }
signature = "=2.2.0"
x509-cert = { version = "=0.3.0", default-features = false, features = ["pem", "std"] }
zeroize = "=1.9.0"

[dev-dependencies]
cleverestricky-keybox-core = { path = "../keybox-core" }
cleverestricky-xml-core = { path = "../xml-core" }

[lints.rust]
unsafe_code = "forbid"
